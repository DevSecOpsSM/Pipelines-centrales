# ═══════════════════════════════════════════════════════════════════════════
# SSDLC · Etapa 1 — Detección de Secretos
# Herramientas: Gitleaks (Docker) + TruffleHog
# Modo Auditoría: reporta hallazgos sin bloquear el pipeline
# ═══════════════════════════════════════════════════════════════════════════

name: Security - Secrets Scanning

on:
  workflow_call:
    secrets:
      PIPELINE_TOKEN:
        description: "Token opcional con permisos de lectura a pipelines-centrales (si el repo es privado)"
        required: false

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 · GITLEAKS — Detección de secretos en todo el historial git
  # ─────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: "Gitleaks — Secret Detection"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repositorio (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear directorio de reportes
        run: mkdir -p "reports/${{ github.event.repository.name }}"

      - name: Ejecutar Gitleaks (Docker)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --verbose \
            --report-format json \
            --report-path /repo/reports/gitleaks-raw.json \
            --exit-code 0 || true

      - name: Generar reporte HTML
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          PYTHON_SCRIPT: |
            import json, html, os
            from datetime import datetime

            repo_name = os.environ['REPO_NAME']
            repo_full = os.environ['REPO_FULL']
            sha       = os.environ['SHA'][:7]
            ref       = os.environ['REF']
            fecha     = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
            out_dir   = f"reports/{repo_name}"

            findings = []
            raw_path = "reports/gitleaks-raw.json"
            if os.path.exists(raw_path):
                try:
                    data = json.load(open(raw_path))
                    if isinstance(data, list):
                        findings = data
                except Exception:
                    pass

            count   = len(findings)
            
            def translate_es(text):
                if not text or len(str(text).strip()) < 5:
                    return str(text)
                try:
                    from deep_translator import GoogleTranslator
                    result = GoogleTranslator(source='auto', target='es').translate(str(text)[:500])
                    return result if result else str(text)
                except Exception:
                    return str(text)

            def tdesc(en):
                es = translate_es(en)
                if es != en:
                    return (f'<span title="EN: {html.escape(en)}" '
                            f'style="cursor:help;border-bottom:1px dashed #444">'
                            f'{html.escape(es)}</span>'
                            f' <span style="font-size:10px;color:#58a6ff">🌐</span>')
                return html.escape(en)

            rows = ""
            for f in findings:
                rule  = html.escape(str(f.get("RuleID", "N/A")))
                desc  = tdesc(str(f.get("Description", "N/A")))
                file  = html.escape(str(f.get("File", "N/A")))
                line  = f.get("StartLine", "?")
                raw   = str(f.get("Match", ""))
                redac = raw[:4] + "****" + raw[-4:] if len(raw) > 8 else "****"
                rows += f"""<tr>
                  <td class="col-type"><span class="badge badge-critical">SECRET</span></td>
                  <td class="col-rule"><code class="rule">{rule}</code></td>
                  <td class="col-file file-path">{file}:{line}</td>
                  <td class="col-desc">{desc}</td>
                  <td class="col-match"><code class="secret">{html.escape(redac)}</code></td>
                </tr>\n"""

            no_findings = "" if count > 0 else """
              <div class="no-findings">
                <div class="no-findings-icon">✅</div>
                <h3>Sin secretos detectados</h3>
                <p>Gitleaks analizó el historial completo del repositorio sin encontrar secretos expuestos.</p>
              </div>"""

            table = f"""
              <table>
                <thead>
                  <tr>
                    <th class="col-type">Tipo</th><th class="col-rule">Regla</th><th class="col-file">Archivo:Línea</th>
                    <th class="col-desc">Descripción</th><th class="col-match">Match (redactado)</th>
                  </tr>
                </thead>
                <tbody>{rows}</tbody>
              </table>""" if count > 0 else ""

            import base64 as _b64g
            _logo_g = '<h2 style="color:#00F1C7;margin-bottom:10px;">Simon</h2>'
            try:
                if os.path.exists("image/logo_claro.png"):
                    with open("image/logo_claro.png","rb") as _lf:
                        _logo_g = f'<img src="data:image/png;base64,{_b64g.b64encode(_lf.read()).decode()}" alt="Simon" height="45">'
            except Exception:
                pass

            report = f"""<!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Gitleaks Report — {repo_name}</title>
              <style>
                *{{box-sizing:border-box;margin:0;padding:0}}
                body{{font-family:'Segoe UI',system-ui,sans-serif;background:#1A1A1A;color:#E7E7E7}}
                .header{{background:#000000;border-bottom:2px solid #00F1C7;padding:30px 40px;position:relative}}
                .logo-container{{margin-bottom:15px}}
                .tool-badge{{background:rgba(246,61,61,0.1);border:1px solid #F63D3D;color:#F63D3D;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700}}
                .header h1{{font-size:26px;font-weight:700;color:#FFFFFF;margin-top:16px}}
                .meta{{color:#B0B0B0;font-size:13px;margin-top:10px}}
                .meta span{{margin-right:20px}}
                .btn-pdf{{position:absolute;top:40px;right:40px;background:#00F1C7;color:#000;font-weight:bold;padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:14px;transition:0.2s}}
                .btn-pdf:hover{{background:#00c4a0}}
                .cards{{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:30px;max-width:1100px;margin:0 auto}}
                .card{{background:#373737;border-radius:8px;padding:24px;text-align:center;border-top:4px solid}}
                .card-total{{border-top-color:#B0B0B0}}.card-critical{{border-top-color:#F63D3D}}
                .card-num{{font-size:40px;font-weight:800;line-height:1}}
                .card-label{{font-size:12px;color:#B0B0B0;text-transform:uppercase;margin-top:8px;letter-spacing:1px}}
                .num-total{{color:#FFFFFF}}.num-critical{{color:#F63D3D}}
                .section{{max-width:1100px;margin:0 auto 30px;padding:0 30px}}
                .section-title{{font-size:16px;font-weight:600;color:#00F1C7;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #373737}}
                .wrap{{background:#000000;border:1px solid #373737;border-radius:8px;overflow:hidden}}
                
                table{{width:100%;border-collapse:collapse;table-layout:fixed}}
                .col-type{{width:10%}} .col-rule{{width:20%}} .col-file{{width:25%}} .col-desc{{width:25%}} .col-match{{width:20%}}
                
                thead{{background:#373737}}
                th{{padding:14px 16px;color:#E7E7E7;font-size:12px;text-transform:uppercase;text-align:left;letter-spacing:0.5px}}
                td{{padding:14px 16px;border-bottom:1px solid #373737;font-size:13px;vertical-align:top;color:#D1D1D1;word-wrap:break-word}}
                tr:hover td{{background:#1A1A1A}}
                .badge{{display:inline-block;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:bold;text-transform:uppercase}}
                .badge-critical{{background:rgba(246,61,61,0.15);color:#F63D3D;border:1px solid #F63D3D}}
                .rule{{background:#373737;color:#00F1C7;padding:2px 6px;border-radius:4px;font-size:11px;word-break:break-all}}
                .secret{{background:#21262d;color:#FAD900;padding:2px 6px;border-radius:4px;font-size:12px;word-break:break-all}}
                .file-path{{color:#888888;font-family:monospace;font-size:12px;word-break:break-all}}
                .no-findings{{text-align:center;padding:80px 40px}}
                .no-findings-icon{{font-size:60px;margin-bottom:16px}}
                .no-findings h3{{font-size:20px;color:#4EDA56;margin-bottom:8px}}
                .no-findings p{{color:#B0B0B0;font-size:14px}}
                .footer{{text-align:center;padding:30px;color:#888888;font-size:12px;border-top:1px solid #373737;margin-top:20px}}
                
                /* ========================================================================= */
                /* REGLAS ESPECÍFICAS PARA IMPRESIÓN (PDF)                                   */
                /* ========================================================================= */
                @media print {{
                  @page {{ margin: 1.5cm; size: auto; }}
                  body {{ 
                    background: #FFFFFF !important; 
                    color: #000000 !important; 
                    -webkit-print-color-adjust: exact !important; 
                    print-color-adjust: exact !important; 
                  }}
                  .header {{ background: #FFFFFF !important; border-bottom: 2px solid #00F1C7 !important; padding: 20px 0; }}
                  .header h1 {{ color: #000000 !important; }}
                  .btn-pdf {{ display: none !important; }}
                  .cards {{ padding: 15px 0; gap: 10px; }}
                  .card {{ background: #F6F6F6 !important; border: 1px solid #D1D1D1 !important; border-top: 4px solid !important; padding: 15px; page-break-inside: avoid; }}
                  .num-total {{ color: #1A1A1A !important; }}
                  .section {{ padding: 0; }}
                  .wrap {{ border: 1px solid #D1D1D1 !important; background: #FFFFFF !important; }}
                  
                  /* Control estricto de la tabla para evitar rupturas */
                  table {{ table-layout: fixed; width: 100%; }}
                  thead {{ display: table-header-group; background: #F6F6F6 !important; }}
                  tr {{ page-break-inside: avoid; page-break-after: auto; }}
                  td {{ border-bottom: 1px solid #E7E7E7 !important; color: #1A1A1A !important; padding: 10px; vertical-align: middle; }}
                  th {{ color: #373737 !important; border-bottom: 2px solid #D1D1D1 !important; padding: 10px; }}
                  
                  /* Arreglo de los badges y códigos en fondo blanco */
                  .badge {{ border: none !important; padding: 4px 8px; font-size: 10px; }}
                  .badge-critical {{ background: #F63D3D !important; color: #FFFFFF !important; }}
                  .rule {{ background: #E7E7E7 !important; color: #000 !important; border: 1px solid #CCC !important; }}
                  .secret {{ background: #FFF9C4 !important; color: #000 !important; border: 1px solid #FAD900 !important; }}
                }}
              </style>
            </head>
            <body>
              <div class="header">
                <button class="btn-pdf" onclick="window.print()">📥 Descargar PDF</button>
                <div class="logo-container">{_logo_g}</div>
                <span class="tool-badge">GITLEAKS</span>
                <h1>Secrets Detection Report</h1>
                <div class="meta">
                  <span>📦 {html.escape(repo_full)}</span>
                  <span>🌿 {html.escape(ref)}</span>
                  <span>🔖 {sha}</span>
                  <span>🕐 {fecha}</span>
                </div>
              </div>

              <div class="cards">
                <div class="card card-total">
                  <div class="card-num num-total">{count}</div>
                  <div class="card-label">Total Secretos</div>
                </div>
                <div class="card card-critical">
                  <div class="card-num num-critical">{count}</div>
                  <div class="card-label">Exposiciones</div>
                </div>
              </div>

              <div class="section">
                <div class="section-title">Hallazgos — Gitleaks (historial completo)</div>
                <div class="wrap">
                  {table}{no_findings}
                </div>
              </div>

              <div class="footer">
                Generado por <strong>pipelines-centrales</strong> · Equipo Cybersecurity · Simon · {fecha}
              </div>
            </body>
            </html>"""

            out_path = f"{out_dir}/gitleaks-report.html"
            with open(out_path, "w", encoding="utf-8") as fh:
                fh.write(report)
            print(f"[Gitleaks] {count} secreto(s) detectado(s) → {out_path}")
        run: |
          pip install deep-translator --quiet 2>/dev/null || true
          # Usamos python3 -c para ejecutar el código desde la variable de entorno directamente,
          # sin pasar el valor por bash, evitando problemas de parseo de comillas.
          python3 -c "import os; exec(os.environ['PYTHON_SCRIPT'])"

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-secrets-gitleaks
          path: reports/${{ github.event.repository.name }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Obtener scripts de IA (pipelines-centrales)
        if: always()
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pipelines-centrales
          path: .ai-scripts
          token: ${{ secrets.PIPELINE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Crear Issues con Remediación IA — Quality Gate (Gitleaks)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMMA_API_KEY: ${{ secrets.GEMMA_API_KEY }}
          GEMINI_MODEL: "gemma-4-26b-a4b-it"
        run: |
          pip install requests --quiet
          python .ai-scripts/scripts/ai/gemma_client.py \
            --tool gitleaks \
            --results reports/gitleaks-raw.json

  
       
