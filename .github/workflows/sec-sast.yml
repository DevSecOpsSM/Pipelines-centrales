      #     mkdir -p .ai-scripts/scripts/ai
      #     RAW="https://raw.githubusercontent.com/${{ github.repository_owner }}/pipelines-centrales/main/scripts/ai"
      #     curl -fsSL "${RAW}/gemma_client.py"     -o .ai-scripts/scripts/ai/gemma_client.py     || true
      #     curl -fsSL "${RAW}/prompt_templates.py" -o .ai-scripts/scripts/ai/prompt_templates.py || true
      #
      # - name: Crear Issues con Remediación IA — Quality Gate
      #   if: always()
      #   env:
      #     GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
      #     GEMMA_API_KEY: ${{ secrets.GEMMA_API_KEY }}
      #     GEMINI_MODEL:  "gemini-2.5-flash"
