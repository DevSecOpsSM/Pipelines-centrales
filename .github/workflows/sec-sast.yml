# ═══════════════════════════════════════════════════════════════════════════
# SSDLC · Etapa 2 — SAST (Static Application Security Testing)
# Herramienta: Semgrep — OWASP Top 10 + Secrets + CI rules
# Modo Auditoría: reporta hallazgos sin bloquear el pipeline
# Universal: funciona con cualquier lenguaje de programación
# ═══════════════════════════════════════════════════════════════════════════

name: Security - SAST (Semgrep)

on:
  workflow_call:

jobs:
  semgrep:
    name: "Semgrep — SAST OWASP Top 10"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Crear directorio de reportes
        run: mkdir -p "reports/${{ github.event.repository.name }}"

      - name: Instalar Semgrep
        run: pip install semgrep --quiet

      - name: Ejecutar Semgrep — OWASP Top 10 + Secrets + CI
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/ci \
            --json \
            --output reports/semgrep-raw.json \
            --timeout 300 \
            --max-memory 1500 \
            . 2>/dev/null || true

          # Garantizar archivo JSON válido si Semgrep no produjo salida
          if [ ! -s reports/semgrep-raw.json ]; then
            echo '{"results":[],"errors":[],"version":"0"}' > reports/semgrep-raw.json
          fi

      - name: Generar reporte HTML
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          PYTHON_SCRIPT: |
            import json, html, os
            from datetime import datetime

            repo_name = os.environ['REPO_NAME']
            repo_full = os.environ['REPO_FULL']
            sha       = os.environ['SHA'][:7]
            ref       = os.environ['REF']
            fecha     = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
            out_dir   = f"reports/{repo_name}"

            results = []
            errors  = []
            try:
                data    = json.load(open("reports/semgrep-raw.json", encoding="utf-8"))
                results = data.get("results", [])
                errors  = data.get("errors", [])
            except Exception:
                pass

            def translate_es(text):
                if not text or len(str(text).strip()) < 5:
                    return str(text)
                try:
                    from deep_translator import GoogleTranslator
                    result = GoogleTranslator(source='auto', target='es').translate(str(text)[:500])
                    return result if result else str(text)
                except Exception:
                    return str(text)

            def tdesc(en):
                es = translate_es(en)
                if es != en:
                    return (f'<span title="EN: {html.escape(en)}" '
                            f'style="cursor:help;border-bottom:1px dashed #444">'
                            f'{html.escape(es)}</span>'
                            f' <span style="font-size:10px;color:#58a6ff">🌐</span>')
                return html.escape(en)

            # Mapeo de severidad Semgrep → nivel visual
            SEV_MAP = {"ERROR": "critical", "WARNING": "high", "INFO": "medium"}
            SEV_LABEL = {"ERROR": "ERROR", "WARNING": "WARNING", "INFO": "INFO"}

            counts = {"ERROR": 0, "WARNING": 0, "INFO": 0}
            for r in results:
                sev = r.get("extra", {}).get("severity", "INFO").upper()
                counts[sev] = counts.get(sev, 0) + 1

            total = len(results)

            rows = ""
            for r in results[:200]:
                sev       = r.get("extra", {}).get("severity", "INFO").upper()
                css_class = SEV_MAP.get(sev, "medium")
                label     = SEV_LABEL.get(sev, sev)
                check_id  = r.get("check_id", "")
                rule_short = check_id.split(".")[-1] if "." in check_id else check_id
                rule_full  = html.escape(check_id)
                rule_disp  = html.escape(rule_short)
                filepath   = html.escape(r.get("path", "?"))
                line_s     = r.get("start", {}).get("line", "?")
                msg        = tdesc(r.get("extra", {}).get("message", "")[:200])
                meta       = r.get("extra", {}).get("metadata", {})
                owasp_ref  = ""
                if "owasp" in meta:
                    owasp_val = meta["owasp"]
                    owasp_str = owasp_val[0] if isinstance(owasp_val, list) else str(owasp_val)
                    owasp_ref = f'<br><span style="font-size:11px;color:#58a6ff">{html.escape(owasp_str[:60])}</span>'
                rows += f"""<tr>
                  <td><span class="badge badge-{css_class}">{label}</span></td>
                  <td title="{rule_full}"><code class="rule">{rule_disp}</code></td>
                  <td class="file-path">{filepath}:{line_s}</td>
                  <td>{msg}{owasp_ref}</td>
                </tr>\n"""

            error_block = ""
            if errors:
                err_items = "".join(
                    f'<li>{html.escape(str(e.get("message", e.get("msg", str(e))))[:180])}</li>'
                    for e in errors[:20]
                )
                error_block = f"""
                <div class="section">
                  <div class="section-title" style="color:#d29922">Advertencias de Semgrep ({len(errors)})</div>
                  <div class="findings-wrap" style="padding:20px">
                    <ul style="font-size:13px;color:#8b949e;line-height:1.8">{err_items}</ul>
                  </div>
                </div>"""

            no_findings = "" if total > 0 else """
              <div class="no-findings">
                <div class="no-findings-icon">✅</div>
                <h3>Sin hallazgos</h3>
                <p>Semgrep analizó el código con las reglas OWASP Top 10, Secrets y CI sin encontrar problemas.</p>
              </div>"""

            table = f"""
              <table>
                <thead>
                  <tr>
                    <th>Severidad</th><th>Regla</th><th>Archivo:Línea</th><th>Descripción</th>
                  </tr>
                </thead>
                <tbody>{rows}</tbody>
              </table>""" if total > 0 else ""

            report = f"""<!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Semgrep SAST Report — {repo_name}</title>
              <style>
                *{{box-sizing:border-box;margin:0;padding:0}}
                body{{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}}
                .header{{background:linear-gradient(135deg,#0d1117 0%,#161b22 50%,#1c2128 100%);border-bottom:1px solid #30363d;padding:40px}}
                .header-top{{display:flex;align-items:center;gap:16px;margin-bottom:16px}}
                .tool-badge{{background:#0d1d31;border:1px solid #1f6feb;color:#58a6ff;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:1px}}
                .header h1{{font-size:26px;font-weight:700;color:#f0f6fc}}
                .header-meta{{color:#8b949e;font-size:13px;margin-top:8px}}
                .header-meta span{{margin-right:24px}}
                .summary{{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;padding:30px;max-width:1100px;margin:0 auto}}
                .card{{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:22px;text-align:center;border-top:3px solid}}
                .card-total{{border-top-color:#8b949e}}
                .card-error{{border-top-color:#da3633}}
                .card-warning{{border-top-color:#9e6a03}}
                .card-info{{border-top-color:#1f6feb}}
                .card-num{{font-size:38px;font-weight:800;line-height:1}}
                .card-label{{font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:0.8px;margin-top:6px}}
                .num-total{{color:#8b949e}}.num-error{{color:#f85149}}
                .num-warning{{color:#d29922}}.num-info{{color:#58a6ff}}
                .section{{max-width:1100px;margin:0 auto 30px;padding:0 30px}}
                .section-title{{font-size:16px;font-weight:600;color:#58a6ff;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #21262d}}
                .findings-wrap{{background:#161b22;border:1px solid #30363d;border-radius:10px;overflow:hidden}}
                table{{width:100%;border-collapse:collapse}}
                thead{{background:#21262d}}
                th{{padding:12px 16px;color:#8b949e;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.6px;text-align:left}}
                td{{padding:12px 16px;border-bottom:1px solid #21262d;font-size:13px;vertical-align:top}}
                tr:last-child td{{border-bottom:none}}
                tr:hover td{{background:#1c2128}}
                .badge{{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}}
                .badge-critical{{background:#3d1114;color:#f85149;border:1px solid #da3633}}
                .badge-high{{background:#3d2e08;color:#d29922;border:1px solid #9e6a03}}
                .badge-medium{{background:#0d1d31;color:#58a6ff;border:1px solid #1f6feb}}
                .rule{{background:#21262d;color:#79c0ff;padding:2px 6px;border-radius:4px;font-size:11px;word-break:break-all}}
                .file-path{{color:#7d8590;font-family:monospace;font-size:12px}}
                .no-findings{{text-align:center;padding:80px 40px}}
                .no-findings-icon{{font-size:60px;margin-bottom:16px}}
                .no-findings h3{{font-size:20px;color:#3fb950;margin-bottom:8px}}
                .no-findings p{{color:#8b949e;font-size:14px}}
                .footer{{text-align:center;padding:30px;color:#8b949e;font-size:12px;border-top:1px solid #21262d;margin-top:20px}}
                .rules-info{{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px 20px;margin-bottom:20px;font-size:13px;color:#8b949e}}
                .rules-info strong{{color:#c9d1d9}}
              </style>
            </head>
            <body>
              <div class="header">
                <div class="header-top">
                  <span class="tool-badge">SEMGREP — SAST</span>
                </div>
                <h1>Static Application Security Testing Report</h1>
                <div class="header-meta">
                  <span>📦 {html.escape(repo_full)}</span>
                  <span>🌿 {html.escape(ref)}</span>
                  <span>🔖 {sha}</span>
                  <span>🕐 {fecha}</span>
                </div>
              </div>

              <div class="summary">
                <div class="card card-total">
                  <div class="card-num num-total">{total}</div>
                  <div class="card-label">Total</div>
                </div>
                <div class="card card-error">
                  <div class="card-num num-error">{counts.get("ERROR", 0)}</div>
                  <div class="card-label">Error</div>
                </div>
                <div class="card card-warning">
                  <div class="card-num num-warning">{counts.get("WARNING", 0)}</div>
                  <div class="card-label">Warning</div>
                </div>
                <div class="card card-info">
                  <div class="card-num num-info">{counts.get("INFO", 0)}</div>
                  <div class="card-label">Info</div>
                </div>
              </div>

              <div class="section">
                <div class="rules-info">
                  Reglas aplicadas: <strong>p/owasp-top-ten</strong> · <strong>p/secrets</strong> · <strong>p/ci</strong>
                  — Cobertura multi-lenguaje (Python, JS/TS, Java, Go, PHP, Ruby, C/C++, Kotlin, Swift y más)
                </div>
                <div class="section-title">Hallazgos — Semgrep SAST</div>
                <div class="findings-wrap">
                  {table}{no_findings}
                </div>
              </div>

              {error_block}

              <div class="footer">
                Generado por <strong>pipelines-centrales</strong> · Equipo Cybersecurity · {fecha}
              </div>
            </body>
            </html>"""

            out_path = f"{out_dir}/semgrep-report.html"
            with open(out_path, "w", encoding="utf-8") as fh:
                fh.write(report)
            print(f"[Semgrep] {total} hallazgo(s): ERROR={counts.get('ERROR',0)}, WARNING={counts.get('WARNING',0)}, INFO={counts.get('INFO',0)} → {out_path}")
        run: |
          pip install deep-translator --quiet 2>/dev/null || true
          python3 -c "$PYTHON_SCRIPT"

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-sast-semgrep
          path: reports/${{ github.event.repository.name }}/
          retention-days: 30
          if-no-files-found: warn
