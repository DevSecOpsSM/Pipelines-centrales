# ═══════════════════════════════════════════════════════════════════════════
# SSDLC · Etapa 3 — SCA (Software Composition Analysis)
# Herramienta: OWASP Dependency-Check (Docker)
# Modo Auditoría: reporta hallazgos sin bloquear el pipeline
# Fix NVD: Cache semanal + delay API para evitar 429 y timeout de 6h
# ═══════════════════════════════════════════════════════════════════════════

name: Security - SCA (OWASP Dependency-Check)

on:
  workflow_call:
    secrets:
      NVD_API_KEY:
        description: "API Key opcional de NVD (nvd.nist.gov) para mayor velocidad de descarga"
        required: false

jobs:
  dependency-check:
    name: "OWASP Dependency-Check — SCA"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Obtener clave de caché semanal
        id: cache-key
        run: echo "week=$(date +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Restaurar caché NVD (base de datos semanal)
        id: nvd-cache
        uses: actions/cache@v4
        with:
          path: .dc-cache
          key: owasp-dc-nvd-${{ runner.os }}-${{ steps.cache-key.outputs.week }}
          restore-keys: |
            owasp-dc-nvd-${{ runner.os }}-

      - name: Crear directorios de trabajo
        run: |
          mkdir -p .dc-cache
          mkdir -p "reports/${{ github.event.repository.name }}"
          # Permisos para que el contenedor Docker pueda escribir en la caché
          chmod -R 777 .dc-cache

      - name: Ejecutar OWASP Dependency-Check (Docker)
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # Construir argumentos opcionales
          NVD_ARGS=""
          if [ -n "$NVD_API_KEY" ]; then
            NVD_ARGS="--nvdApiKey $NVD_API_KEY"
            echo "[DC] Usando NVD API Key → mayor velocidad de actualización"
          else
            echo "[DC] Sin NVD API Key → usando delay de 6s entre peticiones para evitar rate-limit"
          fi

          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/.dc-cache:/usr/share/dependency-check/data" \
            owasp/dependency-check:latest \
            --project "${{ github.event.repository.name }}" \
            --scan /src \
            --format HTML \
            --format JSON \
            --out /src/reports/${{ github.event.repository.name }} \
            --failOnCVSS 99 \
            --nvdApiDelay 6000 \
            --disableAssembly \
            $NVD_ARGS \
            2>&1 | tail -20 || true

      # Movemos el script de Python a una variable de entorno para evitar problemas de indentación YAML
      - name: Fallback HTML si Dependency-Check no generó reporte
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          PYTHON_SCRIPT: |
            import json, html, os
            from datetime import datetime

            repo_name = os.environ['REPO_NAME']
            repo_full = os.environ['REPO_FULL']
            sha       = os.environ['SHA'][:7]
            ref       = os.environ['REF']
            fecha     = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
            out_dir   = f"reports/{repo_name}"

            html_path = os.path.join(out_dir, "dependency-check-report.html")
            json_path = os.path.join(out_dir, "dependency-check-report.json")

            if os.path.exists(html_path) and os.path.getsize(html_path) > 1000:
                print(f"[DC] Reporte HTML nativo encontrado ({os.path.getsize(html_path)} bytes) — OK")
                exit(0)

            print("[DC] Reporte HTML nativo no encontrado — generando desde JSON...")

            vulns = []
            dep_count = 0
            if os.path.exists(json_path):
                try:
                    data = json.load(open(json_path, encoding="utf-8"))
                    deps = data.get("dependencies", [])
                    dep_count = len(deps)
                    for dep in deps:
                        for v in dep.get("vulnerabilities", []):
                            v["_dep"] = dep.get("fileName", "?")
                            v["_ecosystem"] = dep.get("ecosystem", "?")
                            vulns.append(v)
                except Exception as e:
                    print(f"[DC] Error leyendo JSON: {e}")

            def translate_es(text):
                if not text or len(str(text).strip()) < 5:
                    return str(text)
                try:
                    from deep_translator import GoogleTranslator
                    result = GoogleTranslator(source='auto', target='es').translate(str(text)[:500])
                    return result if result else str(text)
                except Exception:
                    return str(text)

            def tdesc(en):
                es = translate_es(en)
                if es != en:
                    return (f'<span title="EN: {html.escape(en)}" '
                            f'style="cursor:help;border-bottom:1px dashed #444">'
                            f'{html.escape(es)}</span>'
                            f' <span style="font-size:10px;color:#58a6ff">🌐</span>')
                return html.escape(en)

            def cvss_score(v):
                return float(v.get("cvssv3", {}).get("baseScore",
                       v.get("cvssv2", {}).get("score", 0)) or 0)
            vulns.sort(key=cvss_score, reverse=True)

            total = len(vulns)
            counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
            for v in vulns:
                sev = v.get("severity", "").upper()
                if sev in counts:
                    counts[sev] += 1

            SEV_CSS = {
                "CRITICAL": ("badge-critical", "#f85149"),
                "HIGH":     ("badge-high",     "#d29922"),
                "MEDIUM":   ("badge-medium",   "#58a6ff"),
                "LOW":      ("badge-low",      "#7d8590"),
            }

            rows = ""
            for v in vulns[:300]:
                sev     = v.get("severity", "?").upper()
                css, _  = SEV_CSS.get(sev, ("badge-low", "#7d8590"))
                name    = html.escape(v.get("name", "?"))
                dep     = html.escape(v.get("_dep", "?"))
                score_v3 = v.get("cvssv3", {}).get("baseScore", "")
                score_v2 = v.get("cvssv2", {}).get("score", "")
                score   = str(score_v3) if score_v3 else str(score_v2) if score_v2 else "N/A"
                desc    = tdesc(v.get("description", "")[:180])
                rows += f"""<tr>
                  <td><span class="badge {css}">{sev}</span></td>
                  <td class="cvss-score">{score}</td>
                  <td><strong>{name}</strong></td>
                  <td class="file-path">{dep}</td>
                  <td style="font-size:12px;color:#8b949e">{desc}</td>
                </tr>\n"""

            status_note = ""
            if total == 0 and dep_count == 0:
                status_note = """
                <div class="notice">
                  ⚠️ <strong>Nota:</strong> OWASP Dependency-Check no pudo actualizar la base de datos NVD
                  o no encontró archivos de dependencias en el repositorio.
                  Verifique que el repositorio contenga archivos como <code>pom.xml</code>,
                  <code>package.json</code>, <code>requirements.txt</code>, <code>go.sum</code>, etc.
                </div>"""

            no_findings = "" if total > 0 else f"""
              <div class="no-findings">
                <div class="no-findings-icon">{'⚠️' if dep_count == 0 else '✅'}</div>
                <h3>{'Sin datos de dependencias' if dep_count == 0 else 'Sin vulnerabilidades detectadas'}</h3>
                <p>{'No se encontraron archivos de manifiesto de dependencias.' if dep_count == 0 else f'Se analizaron {dep_count} dependencias sin hallazgos CVE.'}</p>
              </div>"""

            table = f"""
              <table>
                <thead>
                  <tr>
                    <th>Severidad</th><th>CVSS</th><th>CVE</th>
                    <th>Dependencia</th><th>Descripción</th>
                  </tr>
                </thead>
                <tbody>{rows}</tbody>
              </table>""" if total > 0 else ""

            _logo_dc = '<h2 style="color:#00F1C7;margin-bottom:10px;">Simon</h2>'
            try:
                import base64 as _b64dc
                if os.path.exists("image/logo_claro.png"):
                    with open("image/logo_claro.png","rb") as _lf:
                        _logo_dc = f'<img src="data:image/png;base64,{_b64dc.b64encode(_lf.read()).decode()}" alt="Simon" height="45">'
            except Exception:
                pass

            report = f"""<!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <title>Dependency-Check SCA Report — {repo_name}</title>
              <style>
                *{{box-sizing:border-box;margin:0;padding:0}}
                body{{font-family:'Segoe UI',system-ui,sans-serif;background:#1A1A1A;color:#E7E7E7}}
                .header{{background:#000000;border-bottom:2px solid #00F1C7;padding:30px 40px;position:relative}}
                .logo-container{{margin-bottom:15px}}
                .tool-badge{{background:rgba(0,241,199,0.1);border:1px solid #00F1C7;color:#00F1C7;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700}}
                .header h1{{font-size:26px;font-weight:700;color:#FFFFFF;margin-top:16px}}
                .meta{{color:#B0B0B0;font-size:13px;margin-top:10px}}
                .meta span{{margin-right:20px}}
                .btn-pdf{{position:absolute;top:40px;right:40px;background:#00F1C7;color:#000000;font-weight:bold;padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:14px;transition:0.2s}}
                .btn-pdf:hover{{background:#00c4a0}}
                .cards{{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;padding:30px;max-width:1100px;margin:0 auto}}
                .card{{background:#373737;border-radius:8px;padding:20px;text-align:center;border-top:4px solid}}
                .card-total{{border-top-color:#B0B0B0}}
                .card-critical{{border-top-color:#F63D3D}}
                .card-high{{border-top-color:#FAD900}}
                .card-medium{{border-top-color:#00F1C7}}
                .card-low{{border-top-color:#888888}}
                .card-num{{font-size:36px;font-weight:800;line-height:1}}
                .card-label{{font-size:11px;color:#B0B0B0;text-transform:uppercase;margin-top:8px;letter-spacing:1px}}
                .num-total{{color:#FFFFFF}}.num-crit{{color:#F63D3D}}.num-high{{color:#FAD900}}
                .num-med{{color:#00F1C7}}.num-low{{color:#888888}}
                .section{{max-width:1100px;margin:0 auto 30px;padding:0 30px}}
                .section-title{{font-size:16px;font-weight:600;color:#00F1C7;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #373737}}
                .wrap{{background:#000000;border:1px solid #373737;border-radius:8px;overflow:hidden}}
                table{{width:100%;border-collapse:collapse}}
                thead{{background:#373737}}
                th{{padding:14px 16px;color:#E7E7E7;font-size:12px;text-transform:uppercase;text-align:left;letter-spacing:0.5px}}
                td{{padding:12px 16px;border-bottom:1px solid #373737;font-size:13px;vertical-align:top;color:#D1D1D1}}
                tr:hover td{{background:#1A1A1A}}
                .badge{{display:inline-block;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:bold;text-transform:uppercase}}
                .badge-critical{{background:rgba(246,61,61,0.15);color:#F63D3D;border:1px solid #F63D3D}}
                .badge-high{{background:rgba(250,217,0,0.15);color:#FAD900;border:1px solid #FAD900}}
                .badge-medium{{background:rgba(0,241,199,0.15);color:#00F1C7;border:1px solid #00F1C7}}
                .badge-low{{background:rgba(136,136,136,0.15);color:#888888;border:1px solid #888888}}
                .cvss-score{{font-weight:700;font-size:14px;color:#E7E7E7}}
                .file-path{{color:#888888;font-family:monospace;font-size:12px}}
                .no-findings{{text-align:center;padding:80px 40px}}
                .no-findings-icon{{font-size:60px;margin-bottom:16px}}
                .no-findings h3{{font-size:20px;color:#4EDA56;margin-bottom:8px}}
                .no-findings p{{color:#B0B0B0}}
                .notice{{background:rgba(250,217,0,0.08);border:1px solid #FAD900;border-radius:8px;padding:16px 20px;margin-bottom:20px;font-size:13px;color:#FAD900}}
                .notice code{{background:#373737;padding:2px 6px;border-radius:4px;font-size:12px;color:#E7E7E7}}
                .footer{{text-align:center;padding:30px;color:#888888;font-size:12px;border-top:1px solid #373737;margin-top:20px}}
                @media print{{body{{background:#FFFFFF !important;color:#000000 !important}}.header{{background:#FFFFFF !important;border-bottom:2px solid #00F1C7 !important}}.header h1{{color:#000000 !important}}.btn-pdf{{display:none !important}}.wrap{{border:1px solid #D1D1D1 !important;background:#FFFFFF !important}}thead{{background:#F6F6F6 !important}}th{{color:#373737 !important}}td{{border-bottom:1px solid #E7E7E7 !important;color:#1A1A1A !important}}.card{{background:#F6F6F6 !important;border-top:4px solid !important}}}}
              </style>
            </head>
            <body>
              <div class="header">
                <button class="btn-pdf" onclick="window.print()">📥 Descargar PDF</button>
                <div class="logo-container">{_logo_dc}</div>
                <span class="tool-badge">OWASP DEPENDENCY-CHECK — SCA</span>
                <h1>Software Composition Analysis (SCA) Report</h1>
                <div class="meta">
                  <span>📦 {html.escape(repo_full)}</span>
                  <span>🌿 {html.escape(ref)}</span>
                  <span>🔖 {sha}</span>
                  <span>🕐 {fecha}</span>
                </div>
              </div>
              <div class="cards">
                <div class="card card-total"><div class="card-num num-total">{total}</div><div class="card-label">Total CVEs</div></div>
                <div class="card card-critical"><div class="card-num num-crit">{counts["CRITICAL"]}</div><div class="card-label">Critical</div></div>
                <div class="card card-high"><div class="card-num num-high">{counts["HIGH"]}</div><div class="card-label">High</div></div>
                <div class="card card-medium"><div class="card-num num-med">{counts["MEDIUM"]}</div><div class="card-label">Medium</div></div>
                <div class="card card-low"><div class="card-num num-low">{counts["LOW"]}</div><div class="card-label">Low</div></div>
              </div>
              <div class="section">
                {status_note}
                <div class="section-title">Vulnerabilidades en Dependencias — OWASP Dependency-Check</div>
                <div class="wrap">{table}{no_findings}</div>
              </div>
              <div class="footer">Generado por <strong>pipelines-centrales</strong> · Equipo Cybersecurity · Simon · {fecha}<br><em>Base de datos NVD · Cache semanal activa</em></div>
            </body>
            </html>"""

            with open(html_path, "w", encoding="utf-8") as fh:
                fh.write(report)
            print(f"[DC Fallback] {total} CVE(s) en {dep_count} dependencia(s) → {html_path}")
        run: |
          pip install deep-translator --quiet 2>/dev/null || true
          python3 -c "$PYTHON_SCRIPT"

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-sca-dependency-check
          path: reports/${{ github.event.repository.name }}/
          retention-days: 30
          if-no-files-found: warn
