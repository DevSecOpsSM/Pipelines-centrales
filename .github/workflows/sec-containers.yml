      #             body = (f"### 🏗️ Misconfiguración IaC\n\n**Tool**: KICS\n**Sev**: {sev}\n"
      #                     f"**Vuln**: `{qname}`\n\n**Files**:\n{files_str}\n\n> {desc}")
      #             try:
      #                 subprocess.run(['gh', 'issue', 'create', '--title', title, '--body', body], check=True)
      #                 existing_titles.append(title)
      #                 creados_por_sev[sev] += 1
      #             except Exception:
      #                 pass
      #     print(f"[Issues KICS] CRIT:{creados_por_sev['CRITICAL']} HIGH:{creados_por_sev['HIGH']}")
      #     EOF
      #     python3 create_issues_kics.py

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 · HADOLINT — Linter de Dockerfiles
  # ─────────────────────────────────────────────────────────────────────────
  hadolint:
    name: "Hadolint — Dockerfile Linter"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Crear directorio de reportes
        run: mkdir -p "reports/${{ github.event.repository.name }}"

      - name: Instalar Hadolint
        run: |
          curl -sL \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Escanear todos los Dockerfiles
        continue-on-error: true
        run: |
          DOCKERFILES=$(find . -name "Dockerfile*" -not -path "./.git/*" -not -path "./reports/*" | sort)

          if [ -z "$DOCKERFILES" ]; then
            echo "[]" > reports/hadolint-raw.json
            echo "[Hadolint] No se encontraron Dockerfiles"
          else
            echo "[Hadolint] Archivos encontrados:"
            echo "$DOCKERFILES"
            hadolint --format json $DOCKERFILES > reports/hadolint-raw.json 2>/dev/null || true

            if [ ! -s reports/hadolint-raw.json ]; then
              echo "[]" > reports/hadolint-raw.json
            fi
          fi

      - name: Generar reporte HTML
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          PYTHON_SCRIPT: |
            import json, html, os
            from datetime import datetime

            repo_name = os.environ['REPO_NAME']
            repo_full = os.environ['REPO_FULL']
            sha       = os.environ['SHA'][:7]
            ref       = os.environ['REF']
            fecha     = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
            out_dir   = f"reports/{repo_name}"

            findings = []
            try:
                findings = json.load(open("reports/hadolint-raw.json", encoding="utf-8"))
                if not isinstance(findings, list):
                    findings = []
            except Exception:
                pass

            def translate_es(text):
                if not text or len(str(text).strip()) < 5:
                    return str(text)
                try:
                    from deep_translator import GoogleTranslator
                    result = GoogleTranslator(source='auto', target='es').translate(str(text)[:500])
                    return result if result else str(text)
                except Exception:
                    return str(text)

            def tdesc(en):
                es = translate_es(en)
                if es != en:
                    return (f'<span title="EN: {html.escape(en)}" '
                            f'style="cursor:help;border-bottom:1px dashed #444">'
                            f'{html.escape(es)}</span>'
                            f' <span style="font-size:10px;color:#58a6ff">🌐</span>')
                return html.escape(en)

            SEV_CSS = {
                "error":   "badge-critical",
                "warning": "badge-high",
                "info":    "badge-medium",
                "style":   "badge-low",
            }
            counts = {"error": 0, "warning": 0, "info": 0, "style": 0}
            for f in findings:
                lv = f.get("level", "info").lower()
                counts[lv] = counts.get(lv, 0) + 1

            total = len(findings)

            rows = ""
            for f in findings:
                level    = f.get("level", "info").lower()
                css      = SEV_CSS.get(level, "badge-low")
                code     = html.escape(str(f.get("code", "?")))
                msg      = tdesc(str(f.get("message", ""))[:200])
                file_raw = str(f.get("file", "?"))
                file_disp = html.escape(file_raw.lstrip("./"))
                line     = f.get("line", "?")
                col      = f.get("column", "")
                loc      = f"{file_disp}:{line}" + (f":{col}" if col else "")
                rows += f"""<tr>
                  <td><span class="badge {css}">{level.upper()}</span></td>
                  <td><a href="https://github.com/hadolint/hadolint/wiki/{code}"
                         style="color:#58a6ff;text-decoration:none"
                         target="_blank">{code}</a></td>
                  <td class="file-path">{loc}</td>
                  <td style="font-size:13px">{msg}</td>
                </tr>\n"""

            no_findings = "" if total > 0 else """
              <div class="no-findings">
                <div class="no-findings-icon">✅</div>
                <h3>Sin problemas en Dockerfiles</h3>
                <p>Hadolint no encontró violaciones de mejores prácticas, o no hay Dockerfiles en el repositorio.</p>
              </div>"""

            table = f"""
              <table>
                <thead>
                  <tr>
                    <th>Nivel</th><th>Código</th><th>Archivo:Línea</th><th>Descripción</th>
                  </tr>
                </thead>
                <tbody>{rows}</tbody>
              </table>""" if total > 0 else ""

            import base64 as _b64
            _logo = '<h2 style="color:#00F1C7;margin-bottom:10px;">Simon</h2>'
            try:
                if os.path.exists("image/logo_claro.png"):
                    with open("image/logo_claro.png","rb") as _lf:
                        _logo = f'<img src="data:image/png;base64,{_b64.b64encode(_lf.read()).decode()}" alt="Simon" height="45">'
            except Exception:
                pass

            report = f"""<!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width,initial-scale=1.0">
              <title>Hadolint Report — {repo_name}</title>
