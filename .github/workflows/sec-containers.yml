  # ═══════════════════════════════════════════════════════════════════════
  # JOB 4 · QG-SUMMARY — Consolida KICS + Hadolint + Trivy en un solo
  # qg-summary-sec-containers.json (input del consolidador global).
  #
  # Mapeo CVSSv3 por herramienta:
  #   KICS:     CRITICAL→critical · HIGH→high · MEDIUM→medium · LOW→low · INFO→info
  #   Hadolint: error→medium · warning→low · info→info · style→info
  #   Trivy:    CRITICAL→critical · HIGH→high · MEDIUM→medium · LOW→low · UNKNOWN→low
  #
  # workflow_blocked si critical/high/medium > 0 (suma de los 3 tools).
  # ═══════════════════════════════════════════════════════════════════════
  qg-summary:
    name: "Quality Gate — Container Summary"
    needs: [kics, hadolint, trivy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar raw JSONs de KICS · Hadolint · Trivy
        uses: actions/download-artifact@v4
        with:
          pattern: sec-containers-*-raw
          path: raw/
          merge-multiple: false

      - name: Generar qg-summary-sec-containers.json
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          PYTHON_SCRIPT: |
            import json, os
            from pathlib import Path

            repo_name = os.environ['REPO_NAME']
            out_dir   = f"reports/{repo_name}"
            os.makedirs(out_dir, exist_ok=True)

            counts = {"critical": 0, "high": 0, "medium": 0, "low": 0, "info": 0}
            top    = []
            tools_run = []

            # ── KICS ─────────────────────────────────────────────────────
            kics_path = "raw/sec-containers-kics-raw/kics-results.json"
            if os.path.exists(kics_path):
                tools_run.append("kics")
                try:
                    data = json.load(open(kics_path, encoding="utf-8"))
                    queries = data.get("queries", []) or []
                    SEV_KICS = {"CRITICAL":"critical","HIGH":"high","MEDIUM":"medium","LOW":"low","INFO":"info"}
                    for q in queries:
                        sev_native = q.get("severity", "INFO").upper()
                        counts[SEV_KICS.get(sev_native, "info")] += 1
                    sev_order = {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"INFO":4}
                    for q in sorted(queries, key=lambda x: sev_order.get(x.get("severity","INFO").upper(),99))[:5]:
                        sev_native = q.get("severity", "INFO").upper()
                        files = q.get("files") or []
                        loc   = f"{files[0].get('file_name','?')}:{files[0].get('line','?')}" if files else "—"
                        top.append({
                            "tool":        "kics",
                            "severity":    SEV_KICS.get(sev_native, "info"),
                            "rule_id":     q.get("query_name", "?"),
                            "location":    loc,
                            "description": str(q.get("description", ""))[:200],
                        })
                except Exception as e:
                    print(f"[KICS] Error procesando JSON: {e}")

            # ── Hadolint ─────────────────────────────────────────────────
            hado_path = "raw/sec-containers-hadolint-raw/hadolint-raw.json"
            if os.path.exists(hado_path):
                tools_run.append("hadolint")
                try:
                    data = json.load(open(hado_path, encoding="utf-8"))
                    findings = data if isinstance(data, list) else []
                    SEV_HADO = {"error":"medium","warning":"low","info":"info","style":"info"}
                    for f in findings:
                        lv = (f.get("level") or "info").lower()
                        counts[SEV_HADO.get(lv, "info")] += 1
                    for f in findings[:5]:
                        lv = (f.get("level") or "info").lower()
                        top.append({
                            "tool":        "hadolint",
                            "severity":    SEV_HADO.get(lv, "info"),
                            "rule_id":     str(f.get("code", "?")),
                            "location":    f"{f.get('file','?')}:{f.get('line','?')}",
                            "description": str(f.get("message", ""))[:200],
                        })
                except Exception as e:
                    print(f"[Hadolint] Error procesando JSON: {e}")

            # ── Trivy ────────────────────────────────────────────────────
            trivy_path = "raw/sec-containers-trivy-raw/trivy-raw.json"
            if os.path.exists(trivy_path):
                tools_run.append("trivy")
                try:
                    data = json.load(open(trivy_path, encoding="utf-8"))
                    vulns = []
                    for r in data.get("Results", []) or []:
                        for v in r.get("Vulnerabilities", []) or []:
                            v["_target"] = r.get("Target", "?")
                            vulns.append(v)
                    SEV_TRIVY = {"CRITICAL":"critical","HIGH":"high","MEDIUM":"medium","LOW":"low","UNKNOWN":"low"}
                    for v in vulns:
                        sev_native = (v.get("Severity") or "UNKNOWN").upper()
                        counts[SEV_TRIVY.get(sev_native, "low")] += 1
                    sev_order = {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"UNKNOWN":4}
                    for v in sorted(vulns, key=lambda x: sev_order.get((x.get("Severity") or "UNKNOWN").upper(), 99))[:5]:
                        sev_native = (v.get("Severity") or "UNKNOWN").upper()
                        top.append({
                            "tool":        "trivy",
                            "severity":    SEV_TRIVY.get(sev_native, "low"),
                            "rule_id":     v.get("VulnerabilityID", "?"),
                            "location":    f"{v.get('PkgName','?')}@{v.get('InstalledVersion','?')} ({v.get('_target','?')})",
                            "description": str(v.get("Title") or v.get("Description") or "")[:200],
                        })
                except Exception as e:
                    print(f"[Trivy] Error procesando JSON: {e}")

            # ── Decisión global ──────────────────────────────────────────
            blocked = counts["critical"] > 0 or counts["high"] > 0 or counts["medium"] > 0
            reason  = ""
            if blocked:
                parts = []
                for sev in ("critical", "high", "medium"):
                    if counts[sev]:
                        parts.append(f"{counts[sev]} {sev}")
                reason = ", ".join(parts)

            scan_status = "completed" if tools_run else "skipped"
            scan_reason = "" if tools_run else "Ningún raw JSON disponible de KICS/Hadolint/Trivy"

            sev_priority = {"critical":0,"high":1,"medium":2,"low":3,"info":4}
            top.sort(key=lambda f: sev_priority.get(f["severity"], 99))
            top = top[:10]

            summary = {
                "schema_version":         "1.0",
                "workflow":               "sec-containers",
                "workflow_display_name":  "Container & IaC Security",
                "stage_number":           6,
                "tools":                  tools_run,
                "scan_status":            scan_status,
                "scan_status_reason":     scan_reason,
                "severity_counts":        counts,
                "top_findings":           top,
                "workflow_blocked":       blocked,
                "block_reason":           reason,
            }

            out_path = f"{out_dir}/qg-summary-sec-containers.json"
            with open(out_path, "w", encoding="utf-8") as fh:
                json.dump(summary, fh, indent=2, ensure_ascii=False)
            print(f"[qg-summary] sec-containers tools={tools_run} → {counts} blocked={blocked}")
        run: python3 -c "$PYTHON_SCRIPT"

      - name: Subir qg-summary (input para Quality Gate consolidador)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qg-summary-sec-containers
          path: reports/${{ github.event.repository.name }}/qg-summary-sec-containers.json
          retention-days: 30
          if-no-files-found: warn
