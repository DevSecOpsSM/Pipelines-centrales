# ═══════════════════════════════════════════════════════════════════════════
# SSDLC · Etapa 8 — DefectDojo Upload (ASOC / Vuln Management)
#
# Herramienta: DefectDojo (servidor on-prem)
# Sube los raw JSONs de todos los scanners al ASOC platform vía API REST,
# usando los parsers nativos por herramienta (más ricos que SARIF genérico).
#
# Herramientas incluidas (7):
#   - Semgrep (SAST)          - Trivy (containers)
#   - Gitleaks (secrets)      - Hadolint (Dockerfile)
#   - Dependency-Check (SCA)  - Checkov (IaC)
#   - KICS (IaC/containers)
#
# NO incluye SonarQube — se integra nativamente en DefectDojo vía la API key
# configurada en el Product Settings (evita duplicados).
#
# Modelo de datos DD:
#   Product     = nombre del repo
#   Engagement  = nombre de la rama (main, develop, release/*)
#   Test        = un Test por herramienta por rama
#
# Flags:
#   auto_create_context=true   → DD crea Product/Engagement/Test si no existen
#   close_old_findings=true    → dedup automático dentro del engagement
#                                (findings que ya no aparecen → Mitigated)
#
# Modo Auditoría: continue-on-error a nivel de job.
# Outage de DefectDojo NO bloquea release.
#
# ── CONECTIVIDAD ──────────────────────────────────────────────────────────
# DefectDojo es interno. Hay dos formas de alcanzarlo, según dónde corra el
# runner:
#
#   A) Runner con visibilidad de red directa (misma VPC / VPN):
#      → ssm-target vacío (default). Pasar defectdojo-url = URL interna real.
#        Ej: http://10.20.30.40:8088
#
#   B) Runner SIN visibilidad directa (hosted de GitHub, VM de oficina):
#      → ssm-target = instance-id de la EC2 que sirve DD
#      → aws-role-arn = rol asumible vía OIDC con permiso ssm:StartSession
#      → defectdojo-url = http://localhost:8088
#        El job abre el port-forward SSM antes de subir.
#
# En AMBOS casos corre un preflight contra /api/v2/ que falla rápido y con
# mensaje claro, en vez de emitir un Connection refused por cada scanner.
# ═══════════════════════════════════════════════════════════════════════════

name: Security - DefectDojo Upload

on:
  workflow_call:
    inputs:
      defectdojo-url:
        description: "URL base del servidor DefectDojo (sin slash final)"
        type: string
        required: true
      runner-label:
        description: "Etiqueta del runner con visibilidad del servidor DD"
        type: string
        required: false
        default: "self-hosted"
      engagement-branch:
        description: "Nombre del engagement (vacío = usa github.ref_name)"
        type: string
        required: false
        default: ""

      # ── Túnel SSM (opcional) ──────────────────────────────────────────
      ssm-target:
        description: "Instance ID de la EC2 que sirve DD. Vacío = sin túnel (modo A)"
        type: string
        required: false
        default: ""
      ssm-port:
        description: "Puerto de DefectDojo en la instancia remota"
        type: string
        required: false
        default: "8088"
      ssm-local-port:
        description: "Puerto local en el runner. Debe coincidir con defectdojo-url"
        type: string
        required: false
        default: "8088"
      aws-region:
        description: "Región AWS de la instancia"
        type: string
        required: false
        default: "us-east-1"
      aws-role-arn:
        description: "Rol IAM asumible vía OIDC. Requerido si ssm-target != ''"
        type: string
        required: false
        default: ""

    secrets:
      DEFECTDOJO_TOKEN:
        description: "Token API de DefectDojo con permiso Import Scan"
        required: true

# Top-level least-privilege (CKV2_GHA_1). Cada job puede extender si necesita.
permissions:
  contents: read

jobs:
  upload:
    name: "DefectDojo — Import scans"
    runs-on: ${{ inputs.runner-label }}
    permissions:
      contents: read
      actions: read
      id-token: write        # ← OIDC hacia AWS. El job LLAMADOR también debe
                             #   declararlo, o el token no se emite.
    # Outage de DD nunca bloquea el pipeline — la decisión pass/fail ya la
    # tomó el quality-gate-consolidated antes de este job.
    continue-on-error: true

    steps:
      - name: Checkout pipelines-centrales (para el script)
        uses: actions/checkout@v4
        with:
          repository: DevSecOpsSM/pipelines-centrales
          ref: v1.0.0
          path: .pipelines-centrales

      - name: Descargar TODOS los artifacts del run
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/
          merge-multiple: false

      - name: Preparar directorio raw-jsons/
        run: |
          set -e
          mkdir -p raw-jsons
          # NO incluye sonar-issues.json — DD integra SonarQube vía su API key nativa
          for name in gitleaks-raw.json semgrep-raw.json dependency-check-report.json \
                     checkov-raw.json kics-results.json hadolint-raw.json \
                     trivy-raw.json; do
            find all-artifacts -name "$name" -exec cp {} raw-jsons/ \; 2>/dev/null || true
          done
          echo "=== JSONs recolectados para DefectDojo ==="
          ls -la raw-jsons/ 2>/dev/null || echo "(vacío)"

      - name: Resolver nombre del engagement
        id: eng
        run: |
          ENG="${{ inputs.engagement-branch }}"
          if [ -z "$ENG" ]; then
            # En pull_request, github.ref_name = "123/merge" (basura para DD).
            # github.head_ref = rama fuente del PR (feature/x) → lo que queremos.
            # En push, github.head_ref = "" → fallback a github.ref_name (rama).
            ENG="${{ github.head_ref || github.ref_name }}"
          fi
          echo "engagement=$ENG" >> "$GITHUB_OUTPUT"
          echo "Engagement: $ENG"

      # ── Túnel SSM — solo si ssm-target viene definido ──────────────────
      - name: Validar configuración del túnel
        if: inputs.ssm-target != ''
        run: |
          if [ -z "${{ inputs.aws-role-arn }}" ]; then
            echo "::error title=Config::ssm-target está definido pero aws-role-arn está vacío"
            exit 1
          fi

      - name: Configurar credenciales AWS (OIDC)
        if: inputs.ssm-target != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: gha-defectdojo-${{ github.run_id }}

      - name: Instalar session-manager-plugin
        if: inputs.ssm-target != ''
        run: |
          set -e
          if command -v session-manager-plugin >/dev/null 2>&1; then
            echo "Ya instalado: $(session-manager-plugin --version)"
            exit 0
          fi
          curl -sS "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o session-manager-plugin.deb
          sudo dpkg -i session-manager-plugin.deb
          session-manager-plugin --version

      - name: Abrir túnel SSM hacia DefectDojo
        if: inputs.ssm-target != ''
        run: |
          set -e
          nohup aws ssm start-session \
            --target "${{ inputs.ssm-target }}" \
            --document-name AWS-StartPortForwardingSession \
            --parameters "portNumber=${{ inputs.ssm-port }},localPortNumber=${{ inputs.ssm-local-port }}" \
            > ssm-tunnel.log 2>&1 &
          echo $! > ssm-tunnel.pid
          echo "Túnel lanzado (PID $(cat ssm-tunnel.pid)). Esperando handshake..."
          sleep 5

      # ── Preflight — corre SIEMPRE, con o sin túnel ─────────────────────
      - name: Preflight — ¿DefectDojo responde?
        env:
          DD_URL: ${{ inputs.defectdojo-url }}
        run: |
          # Cualquier HTTP != 000 significa que la conexión TCP llegó.
          # 401 es esperado y suficiente: solo falta el token.
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 3 "${DD_URL}/api/v2/" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "::notice title=DefectDojo alcanzable::HTTP ${code} tras ${i} intento(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=DefectDojo inalcanzable::${DD_URL} no respondió en 60s"
          echo "Runner: ${{ inputs.runner-label }} · Túnel SSM: ${{ inputs.ssm-target != '' && 'sí' || 'no' }}"
          if [ -f ssm-tunnel.log ]; then
            echo "--- ssm-tunnel.log ---"
            cat ssm-tunnel.log
          fi
          exit 1

      - name: Instalar dependencias Python
        run: pip install --quiet requests

      - name: Subir a DefectDojo
        env:
          DD_URL:   ${{ inputs.defectdojo-url }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
        run: |
          mkdir -p reports
          python3 .pipelines-centrales/scripts/defectdojo_upload.py \
            --raw-dir raw-jsons \
            --repo "${{ github.repository }}" \
            --branch "${{ steps.eng.outputs.engagement }}" \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --dd-url "$DD_URL" \
            --dd-token "$DD_TOKEN" \
            --summary-out reports/defectdojo-upload-summary.json

      - name: Cerrar túnel SSM
        if: always() && inputs.ssm-target != ''
        run: |
          if [ -f ssm-tunnel.pid ]; then
            kill "$(cat ssm-tunnel.pid)" 2>/dev/null || true
            echo "Túnel cerrado."
          fi

      - name: Publicar resumen en Step Summary
        if: always()
        run: |
          if [ -f reports/defectdojo-upload-summary.json ]; then
            {
              echo "## DefectDojo Upload — resumen"
              echo ""
              python3 -c "
          import json
          d = json.load(open('reports/defectdojo-upload-summary.json'))
          print(f\"**Product:** \`{d['product']}\`  \")
          print(f\"**Engagement:** \`{d['engagement']}\`  \")
          print(f\"**Commit:** \`{d['commit'][:7]}\`  \")
          print(f\"**DD URL:** {d['dd_url']}  \")
          print()
          print(f\"| Uploaded | Failed | Skipped |\")
          print(f\"|----------|--------|---------|\")
          print(f\"| {d['uploaded']} | {d['failed']} | {d['skipped']} |\")
          print()
          print('| Herramienta | Estado | Mensaje |')
          print('|-------------|--------|---------|')
          for r in d['details']:
              icon = {'uploaded':'✅','failed':'❌','skipped':'⏭️'}.get(r['status'],'❓')
              print(f\"| {r['tool']} | {icon} {r['status']} | {r.get('message', r.get('reason',''))[:80]} |\")
          "
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir resumen del upload como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defectdojo-upload-summary
          path: reports/defectdojo-upload-summary.json
          retention-days: 30
          if-no-files-found: warn
