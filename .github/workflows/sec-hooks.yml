# ═══════════════════════════════════════════════════════════════════════════
# SSDLC · Etapa 0 — Pre-commit Hooks (Kicks)
# Ejecuta los hooks configurados en .pre-commit-config.yaml del repositorio
# Si no existe el archivo, genera un reporte informativo con ejemplo mínimo
# Modo Auditoría: reporta sin bloquear el pipeline
# ═══════════════════════════════════════════════════════════════════════════

name: Security - Pre-commit Hooks

on:
  workflow_call:

jobs:
  pre-commit:
    name: "Pre-commit Hooks — Kicks"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crear directorio de reportes
        run: mkdir -p "reports/${{ github.event.repository.name }}"

      - name: Instalar pre-commit
        run: pip install pre-commit --quiet

      # Guardamos el texto largo en una variable de entorno segura
      - name: Ejecutar hooks (si existe configuración)
        id: hooks
        continue-on-error: true
        env:
          INFO_MSG: |
            No se encontró .pre-commit-config.yaml en el repositorio.

            Para activar esta etapa de seguridad, crea el archivo en la raíz del repositorio.

            Ejemplo mínimo recomendado por el equipo de Cybersecurity:

            ┌─────────────────────────────────────────────────────────────────┐
            │ .pre-commit-config.yaml                                         │
            ├─────────────────────────────────────────────────────────────────┤
            │ repos:                                                          │
            │   - repo: https://github.com/pre-commit/pre-commit-hooks        │
            │     rev: v4.6.0                                                 │
            │     hooks:                                                      │
            │       - id: trailing-whitespace                                 │
            │       - id: end-of-file-fixer                                   │
            │       - id: check-yaml                                          │
            │       - id: check-json                                          │
            │       - id: check-added-large-files                             │
            │       - id: detect-private-key                                  │
            │       - id: check-merge-conflict                                │
            │       - id: no-commit-to-branch                                 │
            │         args: [--branch, main, --branch, master]                │
            │                                                                 │
            │   - repo: https://github.com/Yelp/detect-secrets                │
            │     rev: v1.5.0                                                 │
            │     hooks:                                                      │
            │       - id: detect-secrets                                      │
            └─────────────────────────────────────────────────────────────────┘

            Documentación: https://pre-commit.com
        run: |
          OUT="reports/${{ github.event.repository.name }}/kicks-output.txt"

          if [ -f .pre-commit-config.yaml ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
            echo "=== Pre-commit hooks ejecutados en: ${{ github.event.repository.name }} ===" > "$OUT"
            echo "Fecha: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$OUT"
            echo "" >> "$OUT"
            pre-commit run --all-files --show-diff-on-failure 2>&1 >> "$OUT" || true
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "$INFO_MSG" > "$OUT"
          fi

      # Guardamos el script de Python en una variable para evitar errores de indentación
      - name: Generar reporte HTML
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          HAS_CONFIG: ${{ steps.hooks.outputs.has_config }}
          PYTHON_SCRIPT: |
            import os, html
            from datetime import datetime

            repo_name  = os.environ['REPO_NAME']
            repo_full  = os.environ['REPO_FULL']
            sha        = os.environ['SHA'][:7]
            ref        = os.environ['REF']
            has_config = os.environ.get('HAS_CONFIG', 'false') == 'true'
            fecha      = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
            out_dir    = f"reports/{repo_name}"

            output = ""
            out_txt = os.path.join(out_dir, "kicks-output.txt")
            if os.path.exists(out_txt):
                output = open(out_txt, encoding="utf-8").read()

            if has_config:
                passed = "Failed" not in output and "error" not in output.lower()
                status_class = "pass" if passed else "fail"
                status_label = "Hooks ejecutados correctamente" if passed else "Hooks con fallos detectados"
                badge_color  = "#4EDA56" if passed else "#F63D3D"
                badge_bg     = "rgba(78,218,86,0.15)" if passed else "rgba(246,61,61,0.15)"
                badge_border = "#4EDA56" if passed else "#F63D3D"
            else:
                status_class = "warn"
                status_label = "Sin configuración de pre-commit"
                badge_color  = "#FAD900"
                badge_bg     = "rgba(250,217,0,0.15)"
                badge_border = "#FAD900"

            escaped_output = html.escape(output)

            info_block = ""
            if not has_config:
                info_block = """
                <div class="info-box">
                  <strong>ℹ️ Acción recomendada:</strong> Crea el archivo
                  <code>.pre-commit-config.yaml</code> en la raíz del repositorio
                  para activar este control de seguridad pre-commit.
                  El ejemplo mínimo está incluido en el output a continuación.
                </div>"""

            _logo_h = '<h2 style="color:#00F1C7;margin-bottom:10px;">Simon</h2>'
            try:
                import base64 as _b64h
                if os.path.exists("image/logo_claro.png"):
                    with open("image/logo_claro.png","rb") as _lf:
                        _logo_h = f'<img src="data:image/png;base64,{_b64h.b64encode(_lf.read()).decode()}" alt="Simon" height="45">'
            except Exception:
                pass

            report = f"""<!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <title>Pre-commit Hooks Report — {repo_name}</title>
              <style>
                *{{box-sizing:border-box;margin:0;padding:0}}
                body{{font-family:'Segoe UI',system-ui,sans-serif;background:#1A1A1A;color:#E7E7E7}}
                .header{{background:#000000;border-bottom:2px solid #00F1C7;padding:30px 40px;position:relative}}
                .logo-container{{margin-bottom:15px}}
                .tool-badge{{background:rgba(0,241,199,0.1);border:1px solid #00F1C7;color:#00F1C7;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700}}
                .header h1{{font-size:26px;font-weight:700;color:#FFFFFF;margin-top:16px}}
                .meta{{color:#B0B0B0;font-size:13px;margin-top:10px}}
                .meta span{{margin-right:20px}}
                .btn-pdf{{position:absolute;top:40px;right:40px;background:#00F1C7;color:#000000;font-weight:bold;padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:14px;transition:0.2s}}
                .btn-pdf:hover{{background:#00c4a0}}
                .status-section{{padding:30px;max-width:1100px;margin:0 auto}}
                .status-badge{{display:inline-block;padding:10px 24px;border-radius:8px;font-size:15px;font-weight:700;border:1px solid {badge_border};background:{badge_bg};color:{badge_color}}}
                .section{{max-width:1100px;margin:0 auto 30px;padding:0 30px}}
                .section-title{{font-size:16px;font-weight:600;color:#00F1C7;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #373737}}
                .info-box{{background:rgba(250,217,0,0.08);border:1px solid #FAD900;border-radius:8px;padding:16px 20px;margin-bottom:20px;font-size:13px;color:#FAD900}}
                .info-box code{{background:#373737;padding:2px 6px;border-radius:4px;font-size:12px;color:#E7E7E7}}
                .output-box{{background:#000000;border:1px solid #373737;border-radius:8px;padding:24px;overflow-x:auto}}
                pre{{font-family:'Cascadia Code','Fira Code','Courier New',monospace;font-size:13px;line-height:1.7;color:#D1D1D1;white-space:pre-wrap;word-wrap:break-word}}
                .footer{{text-align:center;padding:30px;color:#888888;font-size:12px;border-top:1px solid #373737;margin-top:20px}}
                @media print{{body{{background:#FFFFFF !important;color:#000000 !important}}.header{{background:#FFFFFF !important;border-bottom:2px solid #00F1C7 !important}}.header h1{{color:#000000 !important}}.btn-pdf{{display:none !important}}.output-box{{border:1px solid #D1D1D1 !important;background:#FFFFFF !important}}pre{{color:#1A1A1A !important}}}}
              </style>
            </head>
            <body>
              <div class="header">
                <button class="btn-pdf" onclick="window.print()">📥 Descargar PDF</button>
                <div class="logo-container">{_logo_h}</div>
                <span class="tool-badge">PRE-COMMIT HOOKS — KICKS</span>
                <h1>Pre-commit Security Hooks Report</h1>
                <div class="meta">
                  <span>📦 {html.escape(repo_full)}</span>
                  <span>🌿 {html.escape(ref)}</span>
                  <span>🔖 {sha}</span>
                  <span>🕐 {fecha}</span>
                </div>
              </div>
              <div class="status-section">
                <span class="status-badge">{status_label}</span>
              </div>
              <div class="section">
                {info_block}
                <div class="section-title">Output</div>
                <div class="output-box">
                  <pre>{escaped_output if escaped_output.strip() else '(sin output)'}</pre>
                </div>
              </div>
              <div class="footer">Generado por <strong>pipelines-centrales</strong> · Equipo Cybersecurity · Simon · {fecha}</div>
            </body>
            </html>"""

            out_path = os.path.join(out_dir, "kicks-report.html")
            with open(out_path, "w", encoding="utf-8") as fh:
                fh.write(report)
            print(f"[Kicks] has_config={has_config} → {out_path}")
        run: python3 -c "$PYTHON_SCRIPT"

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-hooks-report
          path: reports/${{ github.event.repository.name }}/
          retention-days: 30
          if-no-files-found: warn
