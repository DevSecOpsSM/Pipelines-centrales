# ═══════════════════════════════════════════════════════════════════════════
# SSDLC · Etapa 1 — Detección de Secretos
# Herramientas: Gitleaks (Docker) + TruffleHog
# Modo Auditoría: reporta hallazgos sin bloquear el pipeline
# ═══════════════════════════════════════════════════════════════════════════

name: Security - Secrets Scanning

on:
  workflow_call:
    secrets:
      PIPELINE_TOKEN:
        description: "Token opcional con permisos de lectura a pipelines-centrales (si el repo es privado)"
        required: false

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 · GITLEAKS — Detección de secretos en todo el historial git
  # ─────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: "Gitleaks — Secret Detection"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repositorio (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear directorio de reportes
        run: mkdir -p "reports/${{ github.event.repository.name }}"

      - name: Ejecutar Gitleaks (Docker)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --verbose \
            --report-format json \
            --report-path /repo/reports/gitleaks-raw.json \
            --exit-code 0 || true

      - name: Generar reporte HTML
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          PYTHON_SCRIPT: |
            import json, html, os
            from datetime import datetime

            repo_name = os.environ['REPO_NAME']
            repo_full = os.environ['REPO_FULL']
            sha       = os.environ['SHA'][:7]
            ref       = os.environ['REF']
            fecha     = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
            out_dir   = f"reports/{repo_name}"

            findings = []
            raw_path = f"{out_dir}/../gitleaks-raw.json" if not os.path.exists(f"reports/gitleaks-raw.json") else "reports/gitleaks-raw.json"
            raw_path = "reports/gitleaks-raw.json"
            if os.path.exists(raw_path):
                try:
                    data = json.load(open(raw_path))
                    if isinstance(data, list):
                        findings = data
                except Exception:
                    pass

            count   = len(findings)
            status  = "ALERTA" if count > 0 else "OK"
            s_class = "fail"   if count > 0 else "pass"

            def translate_es(text):
                if not text or len(str(text).strip()) < 5:
                    return str(text)
                try:
                    from deep_translator import GoogleTranslator
                    result = GoogleTranslator(source='auto', target='es').translate(str(text)[:500])
                    return result if result else str(text)
                except Exception:
                    return str(text)

            def tdesc(en):
                es = translate_es(en)
                if es != en:
                    return (f'<span title="EN: {html.escape(en)}" '
                            f'style="cursor:help;border-bottom:1px dashed #444">'
                            f'{html.escape(es)}</span>'
                            f' <span style="font-size:10px;color:#58a6ff">🌐</span>')
                return html.escape(en)

            rows = ""
            for f in findings:
                rule  = html.escape(str(f.get("RuleID", "N/A")))
                desc  = tdesc(str(f.get("Description", "N/A")))
                file  = html.escape(str(f.get("File", "N/A")))
                line  = f.get("StartLine", "?")
                raw   = str(f.get("Match", ""))
                redac = raw[:4] + "****" + raw[-4:] if len(raw) > 8 else "****"
                rows += f"""<tr>
                  <td><span class="badge badge-critical">SECRET</span></td>
                  <td><code class="rule">{rule}</code></td>
                  <td class="file-path">{file}:{line}</td>
                  <td>{desc}</td>
                  <td><code class="secret">{html.escape(redac)}</code></td>
                </tr>\n"""

            no_findings = "" if count > 0 else """
              <div class="no-findings">
                <div class="no-findings-icon">✅</div>
                <h3>Sin secretos detectados</h3>
                <p>Gitleaks analizó el historial completo del repositorio sin encontrar secretos expuestos.</p>
              </div>"""

            table = f"""
              <table>
                <thead>
                  <tr>
                    <th>Tipo</th><th>Regla</th><th>Archivo:Línea</th>
                    <th>Descripción</th><th>Match (redactado)</th>
                  </tr>
                </thead>
                <tbody>{rows}</tbody>
              </table>""" if count > 0 else ""

            report = f"""<!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Gitleaks Report — {repo_name}</title>
              <style>
                *{{box-sizing:border-box;margin:0;padding:0}}
                body{{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}}
                .header{{background:linear-gradient(135deg,#0d1117 0%,#161b22 50%,#1c2128 100%);border-bottom:1px solid #30363d;padding:40px}}
                .header-top{{display:flex;align-items:center;gap:16px;margin-bottom:16px}}
                .tool-badge{{background:#3d1114;border:1px solid #da3633;color:#f85149;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:1px}}
                .header h1{{font-size:26px;font-weight:700;color:#f0f6fc}}
                .header-meta{{color:#8b949e;font-size:13px;margin-top:8px}}
                .header-meta span{{margin-right:24px}}
                .summary{{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:30px;max-width:1100px;margin:0 auto}}
                .card{{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:24px;text-align:center;border-top:3px solid}}
                .card-total{{border-top-color:#8b949e}}
                .card-critical{{border-top-color:#da3633}}
                .card-num{{font-size:40px;font-weight:800;line-height:1}}
                .card-label{{font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:0.8px;margin-top:6px}}
                .num-total{{color:#8b949e}}.num-critical{{color:#f85149}}
                .section{{max-width:1100px;margin:0 auto 30px;padding:0 30px}}
                .section-title{{font-size:16px;font-weight:600;color:#58a6ff;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #21262d}}
                .findings-wrap{{background:#161b22;border:1px solid #30363d;border-radius:10px;overflow:hidden}}
                table{{width:100%;border-collapse:collapse}}
                thead{{background:#21262d}}
                th{{padding:12px 16px;color:#8b949e;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.6px;text-align:left}}
                td{{padding:12px 16px;border-bottom:1px solid #21262d;font-size:13px;vertical-align:top}}
                tr:last-child td{{border-bottom:none}}
                tr:hover td{{background:#1c2128}}
                .badge{{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}}
                .badge-critical{{background:#3d1114;color:#f85149;border:1px solid #da3633}}
                .rule{{background:#21262d;color:#58a6ff;padding:2px 6px;border-radius:4px;font-size:12px}}
                .secret{{background:#21262d;color:#d29922;padding:2px 6px;border-radius:4px;font-size:12px}}
                .file-path{{color:#7d8590;font-family:monospace;font-size:12px}}
                .no-findings{{text-align:center;padding:80px 40px}}
                .no-findings-icon{{font-size:60px;margin-bottom:16px}}
                .no-findings h3{{font-size:20px;color:#3fb950;margin-bottom:8px}}
                .no-findings p{{color:#8b949e;font-size:14px}}
                .footer{{text-align:center;padding:30px;color:#8b949e;font-size:12px;border-top:1px solid #21262d;margin-top:20px}}
              </style>
            </head>
            <body>
              <div class="header">
                <div class="header-top">
                  <span class="tool-badge">GITLEAKS</span>
                </div>
                <h1>Secrets Detection Report</h1>
                <div class="header-meta">
                  <span>📦 {html.escape(repo_full)}</span>
                  <span>🌿 {html.escape(ref)}</span>
                  <span>🔖 {sha}</span>
                  <span>🕐 {fecha}</span>
                </div>
              </div>

              <div class="summary">
                <div class="card card-total">
                  <div class="card-num num-total">{count}</div>
                  <div class="card-label">Total Secretos</div>
                </div>
                <div class="card card-critical">
                  <div class="card-num num-critical">{count}</div>
                  <div class="card-label">Exposiciones</div>
                </div>
              </div>

              <div class="section">
                <div class="section-title">Hallazgos — Gitleaks (historial completo)</div>
                <div class="findings-wrap">
                  {table}{no_findings}
                </div>
              </div>

              <div class="footer">
                Generado por <strong>pipelines-centrales</strong> · Equipo Cybersecurity · {fecha}
              </div>
            </body>
            </html>"""

            out_path = f"{out_dir}/gitleaks-report.html"
            with open(out_path, "w", encoding="utf-8") as fh:
                fh.write(report)
            print(f"[Gitleaks] {count} secreto(s) detectado(s) → {out_path}")
        run: |
          pip install deep-translator --quiet 2>/dev/null || true
          python3 -c "$PYTHON_SCRIPT"

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-secrets-gitleaks
          path: reports/${{ github.event.repository.name }}/
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 · TRUFFLEHOG — Detección de secretos verificados (activos)
  # ─────────────────────────────────────────────────────────────────────────
  trufflehog:
    name: "TruffleHog — Verified Secrets"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repositorio (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear directorio de reportes
        run: mkdir -p "reports/${{ github.event.repository.name }}"

      - name: Ejecutar TruffleHog (Docker)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --json \
            --no-update \
            2>/dev/null > reports/trufflehog-raw.json || true

          if [ ! -s reports/trufflehog-raw.json ]; then
            echo "" > reports/trufflehog-raw.json
          fi

      - name: Generar reporte HTML
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          PYTHON_SCRIPT: |
            import json, html, os
            from datetime import datetime

            repo_name = os.environ['REPO_NAME']
            repo_full = os.environ['REPO_FULL']
            sha       = os.environ['SHA'][:7]
            ref       = os.environ['REF']
            fecha     = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
            out_dir   = f"reports/{repo_name}"

            findings = []
            raw_path = "reports/trufflehog-raw.json"
            if os.path.exists(raw_path):
                for line in open(raw_path, encoding="utf-8"):
                    line = line.strip()
                    if not line:
                        continue
                    try:
                        findings.append(json.loads(line))
                    except Exception:
                        pass

            count    = len(findings)
            verified = sum(1 for f in findings if f.get("Verified", False))

            rows = ""
            for f in findings:
                detector   = html.escape(str(f.get("DetectorName", "N/A")))
                is_verf    = f.get("Verified", False)
                badge_cls  = "badge-critical" if is_verf else "badge-medium"
                badge_txt  = "VERIFICADO" if is_verf else "NO VERIFICADO"
                raw        = str(f.get("Raw", ""))
                redac      = raw[:4] + "****" + raw[-4:] if len(raw) > 8 else "****"
                meta       = f.get("SourceMetadata", {}).get("Data", {})
                file_info  = ""
                for key in ("Git", "Filesystem", "S3"):
                    if key in meta:
                        d = meta[key]
                        file_info = html.escape(str(d.get("file", d.get("key", "?"))))
                        break
                rows += f"""<tr>
                  <td><span class="badge {badge_cls}">{badge_txt}</span></td>
                  <td><strong>{detector}</strong></td>
                  <td class="file-path">{file_info or "N/A"}</td>
                  <td><code class="secret">{html.escape(redac)}</code></td>
                </tr>\n"""

            no_findings = "" if count > 0 else """
              <div class="no-findings">
                <div class="no-findings-icon">✅</div>
                <h3>Sin secretos detectados</h3>
                <p>TruffleHog analizó el repositorio sin encontrar credenciales expuestas.</p>
              </div>"""

            table = f"""
              <table>
                <thead>
                  <tr>
                    <th>Estado</th><th>Detector</th><th>Archivo</th><th>Secret (redactado)</th>
                  </tr>
                </thead>
                <tbody>{rows}</tbody>
              </table>""" if count > 0 else ""

            report = f"""<!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>TruffleHog Report — {repo_name}</title>
              <style>
                *{{box-sizing:border-box;margin:0;padding:0}}
                body{{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}}
                .header{{background:linear-gradient(135deg,#0d1117 0%,#161b22 50%,#1c2128 100%);border-bottom:1px solid #30363d;padding:40px}}
                .header-top{{display:flex;align-items:center;gap:16px;margin-bottom:16px}}
                .tool-badge{{background:#3d2e08;border:1px solid #9e6a03;color:#d29922;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:1px}}
                .header h1{{font-size:26px;font-weight:700;color:#f0f6fc}}
                .header-meta{{color:#8b949e;font-size:13px;margin-top:8px}}
                .header-meta span{{margin-right:24px}}
                .summary{{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:30px;max-width:1100px;margin:0 auto}}
                .card{{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:24px;text-align:center;border-top:3px solid}}
                .card-total{{border-top-color:#8b949e}}
                .card-verified{{border-top-color:#da3633}}
                .card-unverified{{border-top-color:#9e6a03}}
                .card-num{{font-size:40px;font-weight:800;line-height:1}}
                .card-label{{font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:0.8px;margin-top:6px}}
                .num-total{{color:#8b949e}}.num-crit{{color:#f85149}}.num-warn{{color:#d29922}}
                .section{{max-width:1100px;margin:0 auto 30px;padding:0 30px}}
                .section-title{{font-size:16px;font-weight:600;color:#58a6ff;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #21262d}}
                .findings-wrap{{background:#161b22;border:1px solid #30363d;border-radius:10px;overflow:hidden}}
                table{{width:100%;border-collapse:collapse}}
                thead{{background:#21262d}}
                th{{padding:12px 16px;color:#8b949e;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.6px;text-align:left}}
                td{{padding:12px 16px;border-bottom:1px solid #21262d;font-size:13px;vertical-align:top}}
                tr:last-child td{{border-bottom:none}}
                tr:hover td{{background:#1c2128}}
                .badge{{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}}
                .badge-critical{{background:#3d1114;color:#f85149;border:1px solid #da3633}}
                .badge-medium{{background:#3d2e08;color:#d29922;border:1px solid #9e6a03}}
                .secret{{background:#21262d;color:#d29922;padding:2px 6px;border-radius:4px;font-size:12px}}
                .file-path{{color:#7d8590;font-family:monospace;font-size:12px}}
                .no-findings{{text-align:center;padding:80px 40px}}
                .no-findings-icon{{font-size:60px;margin-bottom:16px}}
                .no-findings h3{{font-size:20px;color:#3fb950;margin-bottom:8px}}
                .no-findings p{{color:#8b949e;font-size:14px}}
                .footer{{text-align:center;padding:30px;color:#8b949e;font-size:12px;border-top:1px solid #21262d;margin-top:20px}}
              </style>
            </head>
            <body>
              <div class="header">
                <div class="header-top">
                  <span class="tool-badge">TRUFFLEHOG</span>
                </div>
                <h1>Verified Secrets Detection Report</h1>
                <div class="header-meta">
                  <span>📦 {html.escape(repo_full)}</span>
                  <span>🌿 {html.escape(ref)}</span>
                  <span>🔖 {sha}</span>
                  <span>🕐 {fecha}</span>
                </div>
              </div>

              <div class="summary">
                <div class="card card-total">
                  <div class="card-num num-total">{count}</div>
                  <div class="card-label">Total Hallazgos</div>
                </div>
                <div class="card card-verified">
                  <div class="card-num num-crit">{verified}</div>
                  <div class="card-label">Verificados (activos)</div>
                </div>
                <div class="card card-unverified">
                  <div class="card-num num-warn">{count - verified}</div>
                  <div class="card-label">Sin verificar</div>
                </div>
              </div>

              <div class="section">
                <div class="section-title">Hallazgos — TruffleHog</div>
                <div class="findings-wrap">
                  {table}{no_findings}
                </div>
              </div>

              <div class="footer">
                Generado por <strong>pipelines-centrales</strong> · Equipo Cybersecurity · {fecha}
              </div>
            </body>
            </html>"""

            out_path = f"{out_dir}/trufflehog-report.html"
            with open(out_path, "w", encoding="utf-8") as fh:
                fh.write(report)
            print(f"[TruffleHog] {count} hallazgo(s), {verified} verificado(s) → {out_path}")
        run: python3 -c "$PYTHON_SCRIPT"

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-secrets-trufflehog
          path: reports/${{ github.event.repository.name }}/
          retention-days: 30
          if-no-files-found: warn
