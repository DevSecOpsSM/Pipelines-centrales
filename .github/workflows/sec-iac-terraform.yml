              .header h1{{font-size:26px;font-weight:700;color:#FFFFFF;margin-top:16px}}
              .meta{{color:#B0B0B0;font-size:13px;margin-top:10px}} .meta span{{margin-right:20px}}
              .cards{{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;padding:30px;max-width:1100px;margin:0 auto}}
              .card{{background:#373737;border-radius:8px;padding:20px;text-align:center;border-top:4px solid}}
              .card-total{{border-top-color:#B0B0B0}}.card-passed{{border-top-color:#4EDA56}}.card-failed{{border-top-color:#F63D3D}}
              .card-num{{font-size:36px;font-weight:800;line-height:1}}
              .card-label{{font-size:11px;color:#B0B0B0;text-transform:uppercase;margin-top:8px;letter-spacing:1px}}
              .num-total{{color:#FFFFFF}}.num-passed{{color:#4EDA56}}.num-failed{{color:#F63D3D}}
              .section{{max-width:1100px;margin:0 auto 30px;padding:0 30px}}
              .section-title{{font-size:16px;font-weight:600;color:#00F1C7;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #373737}}
              .wrap{{background:#000000;border:1px solid #373737;border-radius:8px;overflow:hidden}}
              table{{width:100%;border-collapse:collapse;table-layout:fixed}}
              .col-sev{{width:12%}} .col-rule{{width:15%}} .col-resource{{width:23%}} .col-file{{width:20%}} .col-desc{{width:30%}}
              thead{{background:#373737}} th{{padding:14px 16px;color:#E7E7E7;font-size:12px;text-transform:uppercase;text-align:left;letter-spacing:0.5px}}
              td{{padding:14px 16px;border-bottom:1px solid #373737;font-size:13px;vertical-align:top;color:#D1D1D1;word-wrap:break-word}}
              tr:hover td{{background:#1A1A1A}}
              .badge{{display:inline-block;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:bold;text-transform:uppercase}}
              .badge-critical{{background:rgba(246,61,61,0.15);color:#F63D3D;border:1px solid #F63D3D}}
              .badge-high{{background:rgba(250,217,0,0.15);color:#FAD900;border:1px solid #FAD900}}
              .badge-medium{{background:rgba(0,241,199,0.15);color:#00F1C7;border:1px solid #00F1C7}}
              .badge-low{{background:rgba(136,136,136,0.15);color:#888888;border:1px solid #888888}}
              .rule{{background:#373737;color:#00F1C7;padding:2px 6px;border-radius:4px;font-size:11px;word-break:break-all}}
              .file-path{{color:#888888;font-family:monospace;font-size:11px;word-break:break-all}}
              .no-findings{{text-align:center;padding:80px 40px}}
              .no-findings-icon{{font-size:60px;margin-bottom:16px}} .no-findings h3{{font-size:20px;color:#4EDA56;margin-bottom:8px}}
              .no-findings p{{color:#B0B0B0}}
              .footer{{text-align:center;padding:30px;color:#888888;font-size:12px;border-top:1px solid #373737;margin-top:20px}}
            </style></head><body>
              <div class="header">
                <div class="logo-container">{_logo}</div>
                <span class="tool-badge">CHECKOV — IaC SECURITY</span>
                <h1>Terraform Security Report</h1>
                <div class="meta">
                  <span>📦 {html.escape(repo_full)}</span>
                  <span>🌿 {html.escape(ref)}</span>
                  <span>🔖 {sha}</span>
                  <span>🕐 {fecha}</span>
                </div>
              </div>
              <div class="cards">
                <div class="card card-total"><div class="card-num num-total">{total_checks}</div><div class="card-label">Checks Evaluados</div></div>
                <div class="card card-passed"><div class="card-num num-passed">{total_passed}</div><div class="card-label">Checks Exitosos</div></div>
                <div class="card card-failed"><div class="card-num num-failed">{total_failed}</div><div class="card-label">Vulnerabilidades</div></div>
              </div>
