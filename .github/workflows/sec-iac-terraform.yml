# ═══════════════════════════════════════════════════════════════════════════
# SSDLC · Etapa IaC — Terraform Full Analysis
# Herramientas:
#   - terraform fmt    : formato canónico HCL (HashiCorp oficial)
#   - terraform validate: validación sintáctica/semántica (HashiCorp oficial)
#   - tflint           : linter + provider rules + deprecated syntax
#   - Checkov          : seguridad + grafos + contexto (Prisma Cloud)
#   - Trivy config     : segundo opinion de misconfig + secretos en .tf (Aqua)
#
# Modo Auditoría: reporta hallazgos sin abortar los jobs de escaneo.
# La decisión pass/fail la toma el quality-gate-consolidated global aguas
# abajo con base en el qg-summary-sec-iac-terraform.json que emite el
# job `qg-summary` de este workflow.
# ═══════════════════════════════════════════════════════════════════════════

name: Security - IaC Terraform (Full Analysis)

on:
  workflow_call:

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 · terraform fmt + validate (HashiCorp CLI oficial)
  # ─────────────────────────────────────────────────────────────────────────
  terraform-native:
    name: "terraform fmt + validate"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Crear directorio de reportes
        run: mkdir -p "reports/${{ github.event.repository.name }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Detectar directorios con .tf
        id: detect
        run: |
          # Localiza cada directorio único que contenga al menos un .tf,
          # excluyendo paths auxiliares (checkouts, node_modules, etc.).
          DIRS=$(find . -type f -name "*.tf" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -not -path "./.pipelines-centrales/*" \
            -not -path "./node_modules/*" \
            -not -path "./vendor/*" \
            -not -path "./.terraform/*" \
            -not -path "./reports/*" \
            -exec dirname {} \; | sort -u)
          if [ -z "$DIRS" ]; then
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=terraform-native::No se encontraron archivos .tf — saltando fmt/validate"
          else
            echo "has_tf=true" >> "$GITHUB_OUTPUT"
            echo "$DIRS" > tf-dirs.txt
            echo "=== Directorios con .tf detectados ==="
            cat tf-dirs.txt
          fi

      - name: Ejecutar terraform fmt (check + recursive)
        if: steps.detect.outputs.has_tf == 'true'
        continue-on-error: true
        run: |
          # -check: no reescribe, solo reporta.
          # -recursive: recorre subdirectorios (evita loop por dir).
          # -diff: incluye el diff en la salida para diagnóstico.
          terraform fmt -check -recursive -diff . > fmt-output.txt 2>&1 || true
          echo "--- fmt-output.txt ---"
          cat fmt-output.txt || true

      - name: Ejecutar terraform validate por directorio
        if: steps.detect.outputs.has_tf == 'true'
        continue-on-error: true
        run: |
          # validate requiere init previo por directorio (sin backend).
          # Acumulamos resultados en un JSON array por directorio.
          echo "[]" > validate-output.json
          while IFS= read -r DIR; do
            [ -z "$DIR" ] && continue
            echo "=== validate en $DIR ==="
            pushd "$DIR" >/dev/null
            terraform init -backend=false -input=false -no-color >/dev/null 2>&1 || true
            terraform validate -json > /tmp/validate-single.json 2>/dev/null || true
            popd >/dev/null
            # Añadir el dir al objeto para poder ubicar los hallazgos
            python3 -c "
          import json, sys
          try:
              d = json.load(open('/tmp/validate-single.json', encoding='utf-8'))
          except Exception:
              d = {'valid': False, 'error_count': 1, 'warning_count': 0,
                   'diagnostics': [{'severity':'error','summary':'validate falló o no produjo JSON'}]}
          d['_dir'] = '$DIR'
          all_ = json.load(open('validate-output.json', encoding='utf-8'))
          all_.append(d)
          json.dump(all_, open('validate-output.json','w', encoding='utf-8'), indent=2)
          "
          done < tf-dirs.txt
          echo "--- validate-output.json ---"
          cat validate-output.json || true

      - name: Construir terraform-native-raw.json (fmt + validate consolidado)
        if: always()
        env:
          HAS_TF: ${{ steps.detect.outputs.has_tf }}
          PYTHON_SCRIPT: |
            import json, os, re
            from pathlib import Path

            has_tf = os.environ.get("HAS_TF") == "true"
            out = {
                "has_tf": has_tf,
                "fmt": {"unformatted_files": [], "raw": ""},
                "validate": {"by_dir": [], "totals": {"error_count": 0, "warning_count": 0}},
            }

            fmt_path = Path("fmt-output.txt")
            if fmt_path.exists():
                raw = fmt_path.read_text(encoding="utf-8", errors="replace")
                out["fmt"]["raw"] = raw[:20000]  # cap por si es enorme
                # Cada línea que no empieza con "diff" ni "-" ni "+" y termina en .tf
                # típicamente es un path relativo. Simple heurística.
                for line in raw.splitlines():
                    line = line.strip()
                    if line.endswith(".tf") and not line.startswith(("+","-","diff","@@","---","+++")):
                        out["fmt"]["unformatted_files"].append(line)

            v_path = Path("validate-output.json")
            if v_path.exists():
                try:
                    data = json.load(open(v_path, encoding="utf-8"))
                    for entry in data:
                        d = entry.get("_dir", "?")
                        ec = int(entry.get("error_count", 0) or 0)
                        wc = int(entry.get("warning_count", 0) or 0)
                        diags = entry.get("diagnostics") or []
                        out["validate"]["by_dir"].append({
                            "dir": d, "error_count": ec, "warning_count": wc,
                            "diagnostics": diags[:20],   # cap por dir
                        })
                        out["validate"]["totals"]["error_count"]   += ec
                        out["validate"]["totals"]["warning_count"] += wc
                except Exception as exc:
                    out["validate"]["error"] = f"No se pudo leer validate-output.json: {exc}"

            Path("reports").mkdir(exist_ok=True)
            with open("reports/terraform-native-raw.json", "w", encoding="utf-8") as fh:
                json.dump(out, fh, indent=2, ensure_ascii=False)
            print(f"[terraform-native] unformatted={len(out['fmt']['unformatted_files'])} "
                  f"validate_errors={out['validate']['totals']['error_count']} "
                  f"validate_warnings={out['validate']['totals']['warning_count']}")
        run: python3 -c "$PYTHON_SCRIPT"

      - name: Generar reporte HTML — terraform fmt+validate
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          PYTHON_SCRIPT: |
            import json, html, os, base64
            from datetime import datetime

            repo_name = os.environ['REPO_NAME']
            repo_full = os.environ['REPO_FULL']
            sha       = os.environ['SHA'][:7]
            ref       = os.environ['REF']
            fecha     = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
            out_dir   = f"reports/{repo_name}"
            os.makedirs(out_dir, exist_ok=True)

            data = {}
            try:
                data = json.load(open("reports/terraform-native-raw.json", encoding="utf-8"))
            except Exception:
                pass

            unformatted = data.get("fmt", {}).get("unformatted_files", []) or []
            validate = data.get("validate", {})
            totals   = validate.get("totals", {"error_count":0,"warning_count":0})
            by_dir   = validate.get("by_dir", []) or []

            fmt_rows = ""
            for f in unformatted[:200]:
                fmt_rows += f'<tr><td class="file-path">{html.escape(f)}</td></tr>\n'
            fmt_table = ""
            if fmt_rows:
                fmt_table = f'<table><thead><tr><th>Archivo sin formato canónico</th></tr></thead><tbody>{fmt_rows}</tbody></table>'
            else:
                fmt_table = '<div class="no-findings"><div class="no-findings-icon">✅</div><h3>Formato correcto</h3><p>Todos los .tf están formateados canónicamente.</p></div>'

            v_rows = ""
            for entry in by_dir:
                d  = html.escape(entry.get("dir","?"))
                ec = entry.get("error_count", 0)
                wc = entry.get("warning_count", 0)
                for diag in entry.get("diagnostics", [])[:20]:
                    sev = (diag.get("severity") or "info").upper()
                    css = "badge-critical" if sev == "ERROR" else ("badge-medium" if sev == "WARNING" else "badge-low")
                    summary = html.escape(diag.get("summary",""))[:200]
                    detail  = html.escape(diag.get("detail",""))[:300]
                    rng     = diag.get("range") or {}
                    fname   = html.escape(str(rng.get("filename","?")))
                    start   = rng.get("start", {}) or {}
                    line    = start.get("line","?")
                    v_rows += f'''<tr>
                      <td class="col-sev"><span class="badge {css}">{sev}</span></td>
                      <td class="col-dir">{d}</td>
                      <td class="col-file file-path">{fname}:{line}</td>
                      <td class="col-desc"><strong>{summary}</strong><br><span style="color:#888">{detail}</span></td>
                    </tr>\n'''

            v_table = ""
            if v_rows:
                v_table = f'<table><thead><tr><th class="col-sev">Severidad</th><th class="col-dir">Directorio</th><th class="col-file">Archivo:Línea</th><th class="col-desc">Diagnóstico</th></tr></thead><tbody>{v_rows}</tbody></table>'
            else:
                v_table = '<div class="no-findings"><div class="no-findings-icon">✅</div><h3>Sin errores de validación</h3><p>terraform validate no reportó problemas.</p></div>'

            _logo = '<h2 style="color:#00F1C7;margin-bottom:10px;">Simon</h2>'
            try:
                if os.path.exists("image/logo_claro.png"):
                    with open("image/logo_claro.png","rb") as _lf:
                        _logo = f'<img src="data:image/png;base64,{base64.b64encode(_lf.read()).decode()}" alt="Simon" height="45">'
            except Exception:
                pass

            report = f"""<!DOCTYPE html>
            <html lang="es"><head><meta charset="UTF-8"><title>Terraform fmt+validate — {repo_name}</title>
            <style>
              *{{box-sizing:border-box;margin:0;padding:0}}
              body{{font-family:'Segoe UI',system-ui,sans-serif;background:#1A1A1A;color:#E7E7E7}}
              .header{{background:#000000;border-bottom:2px solid #00F1C7;padding:30px 40px}}
              .tool-badge{{background:rgba(0,241,199,0.1);border:1px solid #00F1C7;color:#00F1C7;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700}}
              .header h1{{font-size:26px;font-weight:700;color:#FFFFFF;margin-top:16px}}
              .meta{{color:#B0B0B0;font-size:13px;margin-top:10px}}
              .meta span{{margin-right:20px}}
              .cards{{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:30px;max-width:1100px;margin:0 auto}}
              .card{{background:#373737;border-radius:8px;padding:20px;text-align:center;border-top:4px solid}}
              .card-fmt{{border-top-color:#00F1C7}}.card-errors{{border-top-color:#F63D3D}}.card-warns{{border-top-color:#FAD900}}
              .card-num{{font-size:36px;font-weight:800;line-height:1;color:#FFFFFF}}
              .card-label{{font-size:11px;color:#B0B0B0;text-transform:uppercase;margin-top:8px;letter-spacing:1px}}
              .section{{max-width:1100px;margin:0 auto 30px;padding:0 30px}}
              .section-title{{font-size:16px;font-weight:600;color:#00F1C7;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #373737}}
              .wrap{{background:#000000;border:1px solid #373737;border-radius:8px;overflow:hidden}}
              table{{width:100%;border-collapse:collapse;table-layout:fixed}}
              .col-sev{{width:12%}}.col-dir{{width:22%}}.col-file{{width:28%}}.col-desc{{width:38%}}
              thead{{background:#373737}}
              th{{padding:14px 16px;color:#E7E7E7;font-size:12px;text-transform:uppercase;text-align:left;letter-spacing:0.5px}}
              td{{padding:14px 16px;border-bottom:1px solid #373737;font-size:13px;vertical-align:top;color:#D1D1D1;word-wrap:break-word}}
              tr:hover td{{background:#1A1A1A}}
              .badge{{display:inline-block;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:bold;text-transform:uppercase}}
              .badge-critical{{background:rgba(246,61,61,0.15);color:#F63D3D;border:1px solid #F63D3D}}
              .badge-medium{{background:rgba(250,217,0,0.15);color:#FAD900;border:1px solid #FAD900}}
              .badge-low{{background:rgba(0,241,199,0.15);color:#00F1C7;border:1px solid #00F1C7}}
              .file-path{{color:#888888;font-family:monospace;font-size:11px;word-break:break-all}}
              .no-findings{{text-align:center;padding:60px 40px}}
              .no-findings-icon{{font-size:52px;margin-bottom:14px}}
              .no-findings h3{{font-size:18px;color:#4EDA56;margin-bottom:6px}}
              .no-findings p{{color:#B0B0B0}}
              .footer{{text-align:center;padding:30px;color:#888888;font-size:12px;border-top:1px solid #373737;margin-top:20px}}
            </style></head><body>
              <div class="header">
                <div class="logo-container">{_logo}</div>
                <span class="tool-badge">TERRAFORM · fmt + validate</span>
                <h1>Terraform Native Checks</h1>
                <div class="meta">
                  <span>📦 {html.escape(repo_full)}</span>
                  <span>🌿 {html.escape(ref)}</span>
                  <span>🔖 {sha}</span>
                  <span>🕐 {fecha}</span>
                </div>
              </div>
              <div class="cards">
                <div class="card card-fmt"><div class="card-num">{len(unformatted)}</div><div class="card-label">Archivos sin formato</div></div>
                <div class="card card-errors"><div class="card-num">{totals.get('error_count',0)}</div><div class="card-label">Errores de validate</div></div>
                <div class="card card-warns"><div class="card-num">{totals.get('warning_count',0)}</div><div class="card-label">Warnings de validate</div></div>
              </div>
              <div class="section"><div class="section-title">terraform fmt</div><div class="wrap">{fmt_table}</div></div>
              <div class="section"><div class="section-title">terraform validate</div><div class="wrap">{v_table}</div></div>
              <div class="footer">Generado por <strong>pipelines-centrales</strong> · Equipo Cybersecurity · Simon · {fecha}</div>
            </body></html>"""

            with open(f"{out_dir}/terraform-native-report.html","w",encoding="utf-8") as fh:
                fh.write(report)
            print(f"[terraform-native HTML] Generado con {len(unformatted)} unformatted, {totals.get('error_count',0)} errors.")
        run: python3 -c "$PYTHON_SCRIPT"

      - name: Subir HTML + raw JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-iac-terraform-native-raw
          path: |
            reports/${{ github.event.repository.name }}/terraform-native-report.html
            reports/terraform-native-raw.json
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 · tflint (linter + provider rules)
  # ─────────────────────────────────────────────────────────────────────────
  tflint:
    name: "tflint — Terraform Linter"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Crear directorio de reportes
        run: mkdir -p "reports/${{ github.event.repository.name }}"

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.53.0"

      - name: Detectar directorios con .tf
        id: detect
        run: |
          DIRS=$(find . -type f -name "*.tf" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -not -path "./.pipelines-centrales/*" \
            -not -path "./node_modules/*" \
            -not -path "./vendor/*" \
            -not -path "./.terraform/*" \
            -not -path "./reports/*" \
            -exec dirname {} \; | sort -u)
          if [ -z "$DIRS" ]; then
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
            echo "[]" > tflint-raw.json
            echo "::notice title=tflint::No se encontraron archivos .tf"
          else
            echo "has_tf=true" >> "$GITHUB_OUTPUT"
            echo "$DIRS" > tf-dirs.txt
          fi

      - name: Ejecutar tflint (JSON output por directorio)
        if: steps.detect.outputs.has_tf == 'true'
        continue-on-error: true
        run: |
          # tflint init sin config custom → reglas base + provider rules.
          # Se ejecuta por directorio para respetar módulos separados.
          echo "[]" > tflint-raw.json
          while IFS= read -r DIR; do
            [ -z "$DIR" ] && continue
            pushd "$DIR" >/dev/null
            tflint --init >/dev/null 2>&1 || true
            tflint --format json --no-color > /tmp/tflint-single.json 2>/dev/null || true
            popd >/dev/null
            python3 -c "
          import json
          try:
              d = json.load(open('/tmp/tflint-single.json', encoding='utf-8'))
          except Exception:
              d = {'issues':[], 'errors':[]}
          d['_dir'] = '$DIR'
          all_ = json.load(open('tflint-raw.json', encoding='utf-8'))
          all_.append(d)
          json.dump(all_, open('tflint-raw.json','w', encoding='utf-8'), indent=2)
          "
          done < tf-dirs.txt
          echo "--- tflint-raw.json ---"
          head -c 2000 tflint-raw.json || true

      - name: Copiar tflint-raw.json a reports/
        if: always()
        run: |
          mkdir -p reports
          cp -f tflint-raw.json reports/tflint-raw.json 2>/dev/null || echo "[]" > reports/tflint-raw.json

      - name: Generar reporte HTML — tflint
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          PYTHON_SCRIPT: |
            import json, html, os, base64
            from datetime import datetime

            repo_name = os.environ['REPO_NAME']
            repo_full = os.environ['REPO_FULL']
            sha       = os.environ['SHA'][:7]
            ref       = os.environ['REF']
            fecha     = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
            out_dir   = f"reports/{repo_name}"
            os.makedirs(out_dir, exist_ok=True)

            all_issues = []
            try:
                data = json.load(open("reports/tflint-raw.json", encoding="utf-8"))
                for entry in (data if isinstance(data, list) else [data]):
                    d = entry.get("_dir", "?")
                    for it in entry.get("issues", []) or []:
                        it["_dir"] = d
                        all_issues.append(it)
            except Exception as exc:
                print(f"[tflint HTML] Error leyendo JSON: {exc}")

            # Mapeo tflint severity → CVSSv3
            #   error   → medium (política institucional: bugs en IaC = medium)
            #   warning → low
            #   notice  → info
            SEV_CSS = {"error":"badge-medium","warning":"badge-low","notice":"badge-info","info":"badge-info"}
            counts  = {"error":0,"warning":0,"notice":0,"info":0}

            for it in all_issues:
                sev = (it.get("rule",{}).get("severity") or "notice").lower()
                counts[sev] = counts.get(sev, 0) + 1

            rows = ""
            for it in all_issues[:200]:
                rule = it.get("rule", {}) or {}
                sev  = (rule.get("severity") or "notice").lower()
                css  = SEV_CSS.get(sev, "badge-info")
                rid  = html.escape(rule.get("name","?"))
                link = html.escape(rule.get("link",""))
                msg  = html.escape(it.get("message",""))
                rng  = it.get("range") or {}
                fname = html.escape(str(rng.get("filename","?")))
                start = rng.get("start",{}) or {}
                line  = start.get("line","?")
                d     = html.escape(it.get("_dir","?"))
                rule_html = f'<a href="{link}" style="color:#00F1C7;text-decoration:none" target="_blank">{rid}</a>' if link else rid
                rows += f'''<tr>
                  <td class="col-sev"><span class="badge {css}">{sev.upper()}</span></td>
                  <td class="col-rule"><code class="rule">{rule_html}</code></td>
                  <td class="col-dir">{d}</td>
                  <td class="col-file file-path">{fname}:{line}</td>
                  <td class="col-desc">{msg}</td>
                </tr>\n'''

            no_findings = "" if all_issues else '<div class="no-findings"><div class="no-findings-icon">✅</div><h3>Sin hallazgos de tflint</h3><p>No se detectaron issues de linting en el código Terraform.</p></div>'
            table = f'<table><thead><tr><th class="col-sev">Severidad</th><th class="col-rule">Regla</th><th class="col-dir">Directorio</th><th class="col-file">Archivo:Línea</th><th class="col-desc">Mensaje</th></tr></thead><tbody>{rows}</tbody></table>' if all_issues else ""

            _logo = '<h2 style="color:#00F1C7;margin-bottom:10px;">Simon</h2>'
            try:
                if os.path.exists("image/logo_claro.png"):
                    with open("image/logo_claro.png","rb") as _lf:
                        _logo = f'<img src="data:image/png;base64,{base64.b64encode(_lf.read()).decode()}" alt="Simon" height="45">'
            except Exception:
                pass

            total = len(all_issues)
            report = f"""<!DOCTYPE html>
            <html lang="es"><head><meta charset="UTF-8"><title>tflint — {repo_name}</title>
            <style>
              *{{box-sizing:border-box;margin:0;padding:0}}
              body{{font-family:'Segoe UI',system-ui,sans-serif;background:#1A1A1A;color:#E7E7E7}}
              .header{{background:#000000;border-bottom:2px solid #00F1C7;padding:30px 40px}}
              .tool-badge{{background:rgba(0,241,199,0.1);border:1px solid #00F1C7;color:#00F1C7;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700}}
              .header h1{{font-size:26px;font-weight:700;color:#FFFFFF;margin-top:16px}}
              .meta{{color:#B0B0B0;font-size:13px;margin-top:10px}} .meta span{{margin-right:20px}}
              .cards{{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;padding:30px;max-width:1100px;margin:0 auto}}
              .card{{background:#373737;border-radius:8px;padding:20px;text-align:center;border-top:4px solid #00F1C7}}
              .card-num{{font-size:36px;font-weight:800;color:#FFFFFF}}
              .card-label{{font-size:11px;color:#B0B0B0;text-transform:uppercase;margin-top:8px;letter-spacing:1px}}
              .section{{max-width:1100px;margin:0 auto 30px;padding:0 30px}}
              .section-title{{font-size:16px;font-weight:600;color:#00F1C7;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #373737}}
              .wrap{{background:#000000;border:1px solid #373737;border-radius:8px;overflow:hidden}}
              table{{width:100%;border-collapse:collapse;table-layout:fixed}}
              .col-sev{{width:11%}} .col-rule{{width:20%}} .col-dir{{width:17%}} .col-file{{width:22%}} .col-desc{{width:30%}}
