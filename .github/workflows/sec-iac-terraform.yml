            </style></head><body>
              <div class="header">
                <div class="logo-container">{_logo}</div>
                <span class="tool-badge">TRIVY CONFIG — IaC MISCONFIG</span>
                <h1>Trivy Config Report</h1>
                <div class="meta">
                  <span>📦 {html.escape(repo_full)}</span>
                  <span>🌿 {html.escape(ref)}</span>
                  <span>🔖 {sha}</span>
                  <span>🕐 {fecha}</span>
                </div>
              </div>
              <div class="cards">
                <div class="card"><div class="card-num">{len(miscfgs)}</div><div class="card-label">Misconfigurations</div></div>
                <div class="card"><div class="card-num">{len(secrets)}</div><div class="card-label">Secretos</div></div>
                <div class="card"><div class="card-num">{counts.get('CRITICAL',0)+counts.get('HIGH',0)}</div><div class="card-label">Critical + High</div></div>
              </div>
              <div class="section"><div class="section-title">Misconfigurations</div><div class="wrap">{_table(m_rows, "Sin misconfigurations")}</div></div>
              <div class="section"><div class="section-title">Secretos embebidos</div><div class="wrap">{_table(s_rows, "Sin secretos detectados en IaC")}</div></div>
              <div class="footer">Generado por <strong>pipelines-centrales</strong> · Equipo Cybersecurity · Simon · {fecha}</div>
            </body></html>"""
            with open(f"{out_dir}/trivy-config-report.html","w",encoding="utf-8") as fh:
                fh.write(report)
            print(f"[trivy-config HTML] Generado con {len(miscfgs)} miscfg + {len(secrets)} secrets.")
        run: python3 -c "$PYTHON_SCRIPT"

      - name: Subir HTML + raw JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-iac-terraform-trivy-config-raw
          path: |
            reports/${{ github.event.repository.name }}/trivy-config-report.html
            reports/trivy-config-raw.json
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 5 · QG-SUMMARY — Consolida las 4 herramientas en un solo
  # qg-summary-sec-iac-terraform.json (input del consolidador global).
  #
  # Mapeo CVSSv3 por herramienta:
  #   terraform validate: error → critical (IaC no compila → riesgo alto)
  #                       warning → low
  #   terraform fmt:      unformatted → info (cosmético)
  #   tflint:             error → medium · warning → low · notice/info → info
  #   Checkov:            CRITICAL/HIGH/MEDIUM/LOW nativos; sin severity → HIGH
  #   Trivy config:       CRITICAL/HIGH/MEDIUM/LOW/UNKNOWN nativos
  #
  # workflow_blocked si critical/high/medium > 0 (suma de los 4 tools).
  # ═══════════════════════════════════════════════════════════════════════
  qg-summary:
    name: "Quality Gate — Terraform IaC Summary"
    needs: [terraform-native, tflint, checkov, trivy-config]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar raw JSONs de las 4 herramientas
        uses: actions/download-artifact@v4
        with:
          pattern: sec-iac-terraform-*-raw
          path: raw/
          merge-multiple: false

      - name: Generar qg-summary-sec-iac-terraform.json
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          PYTHON_SCRIPT: |
            import json, os
            from pathlib import Path

            repo_name = os.environ['REPO_NAME']
            out_dir   = f"reports/{repo_name}"
            os.makedirs(out_dir, exist_ok=True)

            counts = {"critical": 0, "high": 0, "medium": 0, "low": 0, "info": 0}
            top    = []
            tools_run = []

            # ── terraform fmt + validate ─────────────────────────────────
            native_path = "raw/sec-iac-terraform-native-raw/terraform-native-raw.json"
            if os.path.exists(native_path):
                tools_run.append("terraform-native")
                try:
                    d = json.load(open(native_path, encoding="utf-8"))
                    # fmt
                    unformatted = d.get("fmt", {}).get("unformatted_files", []) or []
                    counts["info"] += len(unformatted)
                    for f in unformatted[:3]:
                        top.append({
                            "tool":"terraform-fmt","severity":"info","rule_id":"fmt/unformatted",
                            "location": f, "description": "Archivo Terraform sin formato canónico",
                        })
                    # validate
                    for entry in d.get("validate", {}).get("by_dir", []) or []:
                        for diag in entry.get("diagnostics", []) or []:
                            sev = (diag.get("severity") or "info").lower()
                            if sev == "error":
                                counts["critical"] += 1
                                sev_cvss = "critical"
                            elif sev == "warning":
                                counts["low"] += 1
                                sev_cvss = "low"
                            else:
                                counts["info"] += 1
                                sev_cvss = "info"
                            rng = diag.get("range") or {}
                            fname = rng.get("filename", entry.get("dir","?"))
                            line  = (rng.get("start") or {}).get("line","?")
                            top.append({
                                "tool":"terraform-validate","severity":sev_cvss,
                                "rule_id": diag.get("summary","validate")[:60],
                                "location": f"{fname}:{line}",
                                "description": str(diag.get("summary",""))[:200],
                            })
                except Exception as e:
                    print(f"[terraform-native] Error procesando JSON: {e}")

            # ── tflint ───────────────────────────────────────────────────
            tflint_path = "raw/sec-iac-terraform-tflint-raw/tflint-raw.json"
            if os.path.exists(tflint_path):
                tools_run.append("tflint")
                try:
                    data = json.load(open(tflint_path, encoding="utf-8"))
                    SEV_TFLINT = {"error":"medium","warning":"low","notice":"info","info":"info"}
                    all_issues = []
                    for entry in (data if isinstance(data, list) else [data]):
                        d = entry.get("_dir","?")
                        for it in entry.get("issues", []) or []:
                            it["_dir"] = d
                            all_issues.append(it)
                    for it in all_issues:
                        sev_native = (it.get("rule",{}).get("severity") or "notice").lower()
                        counts[SEV_TFLINT.get(sev_native, "info")] += 1
                    sev_order = {"error":0,"warning":1,"notice":2,"info":3}
                    for it in sorted(all_issues, key=lambda x: sev_order.get((x.get("rule",{}).get("severity") or "notice").lower(), 99))[:5]:
                        rule = it.get("rule",{}) or {}
                        sev_native = (rule.get("severity") or "notice").lower()
                        rng = it.get("range") or {}
                        fname = rng.get("filename","?")
                        line  = (rng.get("start") or {}).get("line","?")
                        top.append({
                            "tool":"tflint","severity":SEV_TFLINT.get(sev_native,"info"),
                            "rule_id": rule.get("name","?"),
                            "location": f"{fname}:{line}",
                            "description": str(it.get("message",""))[:200],
                        })
                except Exception as e:
                    print(f"[tflint] Error procesando JSON: {e}")

            # ── Checkov ──────────────────────────────────────────────────
            ck_path = "raw/sec-iac-terraform-checkov-raw/checkov-raw.json"
            if os.path.exists(ck_path):
                tools_run.append("checkov")
                try:
                    data = json.load(open(ck_path, encoding="utf-8"))
                    SEV_CK = {"CRITICAL":"critical","HIGH":"high","MEDIUM":"medium","LOW":"low","INFO":"info"}
                    failed = []
                    reports = data if isinstance(data, list) else [data]
                    for rep in reports:
                        failed.extend((rep.get("results") or {}).get("failed_checks", []) or [])
                    for c in failed:
                        sev_native = (c.get("severity") or "HIGH").upper()
                        counts[SEV_CK.get(sev_native, "high")] += 1
                    sev_order = {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"INFO":4}
                    for c in sorted(failed, key=lambda x: sev_order.get((x.get("severity") or "HIGH").upper(), 99))[:5]:
                        sev_native = (c.get("severity") or "HIGH").upper()
                        rng = c.get("file_line_range", ["?","?"])
                        line_str = f"{rng[0]}-{rng[1]}" if isinstance(rng, list) and len(rng)==2 else "?"
                        top.append({
                            "tool":"checkov","severity":SEV_CK.get(sev_native,"high"),
                            "rule_id": c.get("check_id","?"),
                            "location": f"{c.get('file_path','?')}:{line_str}",
                            "description": str(c.get("check_name",""))[:200],
                        })
                except Exception as e:
                    print(f"[checkov] Error procesando JSON: {e}")

            # ── Trivy config ─────────────────────────────────────────────
            tv_path = "raw/sec-iac-terraform-trivy-config-raw/trivy-config-raw.json"
            if os.path.exists(tv_path):
                tools_run.append("trivy-config")
                try:
                    data = json.load(open(tv_path, encoding="utf-8"))
                    SEV_TV = {"CRITICAL":"critical","HIGH":"high","MEDIUM":"medium","LOW":"low","UNKNOWN":"low"}
                    miscfgs, secrets = [], []
                    for r in data.get("Results", []) or []:
                        target = r.get("Target","?")
                        for m in r.get("Misconfigurations", []) or []:
                            m["_target"] = target; miscfgs.append(m)
                        for s in r.get("Secrets", []) or []:
                            s["_target"] = target; secrets.append(s)
                    for m in miscfgs:
                        sev_native = (m.get("Severity") or "UNKNOWN").upper()
                        counts[SEV_TV.get(sev_native, "low")] += 1
                    for s in secrets:
                        sev_native = (s.get("Severity") or "HIGH").upper()
                        counts[SEV_TV.get(sev_native, "high")] += 1
                    sev_order = {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"UNKNOWN":4}
                    for m in sorted(miscfgs, key=lambda x: sev_order.get((x.get("Severity") or "UNKNOWN").upper(), 99))[:5]:
                        sev_native = (m.get("Severity") or "UNKNOWN").upper()
                        start = (m.get("CauseMetadata") or {}).get("StartLine","?")
                        top.append({
                            "tool":"trivy-config","severity":SEV_TV.get(sev_native,"low"),
                            "rule_id": m.get("ID","?"),
                            "location": f"{m.get('_target','?')}:{start}",
                            "description": str(m.get("Title") or m.get("Message") or "")[:200],
                        })
                    for s in secrets[:3]:
                        sev_native = (s.get("Severity") or "HIGH").upper()
                        top.append({
                            "tool":"trivy-config","severity":SEV_TV.get(sev_native,"high"),
                            "rule_id": s.get("RuleID","secret"),
                            "location": f"{s.get('_target','?')}:{s.get('StartLine','?')}",
                            "description": str(s.get("Title","secret"))[:200],
                        })
                except Exception as e:
                    print(f"[trivy-config] Error procesando JSON: {e}")

            # ── Decisión global ──────────────────────────────────────────
            blocked = counts["critical"] > 0 or counts["high"] > 0 or counts["medium"] > 0
            reason  = ""
            if blocked:
                parts = []
                for sev in ("critical","high","medium"):
                    if counts[sev]:
                        parts.append(f"{counts[sev]} {sev}")
                reason = ", ".join(parts)

            scan_status = "completed" if tools_run else "skipped"
            scan_reason = "" if tools_run else "Ninguna herramienta produjo raw JSON"

            sev_priority = {"critical":0,"high":1,"medium":2,"low":3,"info":4}
            top.sort(key=lambda f: sev_priority.get(f["severity"], 99))
            top = top[:10]

            summary = {
                "schema_version":         "1.0",
                "workflow":               "sec-iac-terraform",
                "workflow_display_name":  "IaC Terraform Full (fmt+validate+tflint+Checkov+Trivy)",
                "stage_number":           5,
                "tools":                  tools_run,
                "scan_status":            scan_status,
                "scan_status_reason":     scan_reason,
                "severity_counts":        counts,
                "top_findings":           top,
                "workflow_blocked":       blocked,
                "block_reason":           reason,
            }

            out_path = f"{out_dir}/qg-summary-sec-iac-terraform.json"
            with open(out_path, "w", encoding="utf-8") as fh:
                json.dump(summary, fh, indent=2, ensure_ascii=False)
            print(f"[qg-summary] sec-iac-terraform tools={tools_run} → {counts} blocked={blocked}")
        run: python3 -c "$PYTHON_SCRIPT"

      - name: Subir qg-summary (input para Quality Gate consolidador)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qg-summary-sec-iac-terraform
          path: reports/${{ github.event.repository.name }}/qg-summary-sec-iac-terraform.json
          retention-days: 30
          if-no-files-found: warn
