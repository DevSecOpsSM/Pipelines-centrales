# =============================================================================
# .checkov.yaml — Repositorio Terraform Simón Movilidad (DEV / UAT / PROD)
# Excepciones justificadas del baseline de seguridad IaC
# Mantenido por: Ciberseguridad · Revisión: en cada auditoría interna del SGSI
# Última actualización: 13/08/2026
#
# Regla de oro: todo skip-check debe tener justificación escrita aquí.
# Un check que no aparece en esta lista permanece ACTIVO y bloquea el gate.
# =============================================================================

compact: true
framework:
  - terraform

skip-check:
  # ---------------------------------------------------------------------------
  # BLOQUE 1 · Decisiones de arquitectura / disponibilidad / costo
  # No son vulnerabilidades. Se gestionan como decisiones de diseño (ADR) y
  # FinOps, no en el gate de seguridad. Recomendables en PROD caso por caso.
  # ---------------------------------------------------------------------------
  - CKV_AWS_135    # EC2 EBS-optimized: rendimiento, no seguridad (31 ocurr.)
  - CKV_AWS_126    # EC2 detailed monitoring: observabilidad opcional, costo CloudWatch
  - CKV_AWS_118    # RDS enhanced monitoring: observabilidad opcional
  - CKV_AWS_353    # RDS Performance Insights: observabilidad opcional
  - CKV_AWS_354    # PI cifrado con CMK: no aplica mientras PI esté deshabilitado
  - CKV_AWS_157    # RDS Multi-AZ: decisión de resiliencia/costo por entorno (DR plan)
  - CKV2_AWS_60    # RDS copy tags to snapshots: higiene de tagging
  - CKV_AWS_226    # RDS auto minor upgrades: se gestiona por ventana de mantenimiento
  - CKV_AWS_150    # ELB deletion protection: operativa; recomendable en PROD vía módulo
  - CKV_AWS_293    # RDS deletion protection: operativa; recomendable en PROD vía módulo
  - CKV_AWS_310    # CloudFront origin failover: decisión de resiliencia, no seguridad
  - CKV_AWS_374    # CloudFront geo restriction: decisión de negocio (operación Colombia)
  - CKV_AWS_305    # CloudFront default root object: funcional, no seguridad

  # ---------------------------------------------------------------------------
  # BLOQUE 2 · Gestión de datos S3 no ligada a exposición
  # La exposición pública (CKV2_AWS_6), cifrado (CKV_AWS_145), versionado
  # (CKV_AWS_21) y access logging (CKV_AWS_18) PERMANECEN ACTIVOS.
  # ---------------------------------------------------------------------------
  - CKV2_AWS_62    # S3 event notifications: solo aplica si hay consumidores de eventos
  - CKV_AWS_144    # S3 cross-region replication: decisión DR/costo (BIA define RPO)
  - CKV2_AWS_61    # S3 lifecycle: FinOps, se gestiona en el frente de optimización de costos

  # ---------------------------------------------------------------------------
  # BLOQUE 3 · Redes: prácticas aceptadas formalmente
  # ---------------------------------------------------------------------------
  # Egress abierto (0.0.0.0/0 ALL) es el estándar corporativo actual; no hay
  # egress filtering desplegado. RIESGO ACEPTADO y registrado. Excepción: los
  # SG del proyecto zero-trust (ay-*-zero-trust) deben endurecerse manualmente
  # por coherencia con el objetivo del proyecto — revisar en cada PR de ese árbol.
  - CKV_AWS_382    # SG egress 0.0.0.0/0 ALL (76 ocurr. — riesgo aceptado RA-IaC-001)
  - CKV2_AWS_5     # SG no adjunto a recurso: higiene (SGs pre-creados para fases futuras)
  - CKV_AWS_23     # SG sin descripción: higiene de código, se corrige oportunísticamente
  - CKV2_AWS_19    # EIP sin adjuntar: costo/higiene, no seguridad

  # ---------------------------------------------------------------------------
  # BLOQUE 4 · SSM Parameter Store
  # 89 de 97 parámetros marcados almacenan valores NO sensibles (endpoints,
  # puertos, nombres de bucket, dominios CloudFront, ARNs). El estándar
  # corporativo es: credenciales SIEMPRE en Secrets Manager, nunca en SSM.
  # PRERREQUISITO antes de confiar en este skip — verificar manualmente que
  # estos parámetros no contengan material sensible en su valor:
  #   · aws_ssm_parameter.keycloak_config            (PROD/UAT snm)
  #   · aws_ssm_parameter.snm_postgres_secret_arn    (solo ARN — verificar)
  #   · aws_ssm_parameter.snm_apps_rds_secret_arn    (solo ARN — verificar)
  #   · aws_ssm_parameter.snm_stora_rds_secret_arn   (solo ARN — verificar)
  # Si algún parámetro futuro requiere valor sensible: usar Secrets Manager.
  - CKV2_AWS_34    # SSM parameter type String (mayormente no sensibles)
  - CKV_AWS_337    # SSM SecureString con CMK: no aplica al no usar SecureString

  # ---------------------------------------------------------------------------
  # BLOQUE 5 · IMDSv2 hop limit (NO se suprime globalmente)
  # CKV_AWS_341 permanece ACTIVO. Las 36 launch templates con hop_limit = 2
  # corresponden a hosts que ejecutan contenedores (Keycloak, Traccar, GPS,
  # message queue, etc.), donde hop limit 2 es REQUISITO para que el contenedor
  # alcance IMDSv2. La excepción se documenta POR RECURSO con skip inline:
  #
  #   metadata_options {
  #     http_tokens                 = "required"
  #     # checkov:skip=CKV_AWS_341:Host de contenedores; hop limit 2 requerido
  #     # para acceso IMDSv2 desde Docker (ver ADR-IaC-IMDS)
  #     http_put_response_hop_limit = 2
  #   }
  #
  # Launch templates de hosts SIN contenedores deben quedar en hop limit 1.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # BLOQUE 6 · Lambda: checks operativos (funciones puntuales, 1 ocurr. c/u)
  # El cifrado de variables de entorno (CKV_AWS_173) PERMANECE ACTIVO.
  # ---------------------------------------------------------------------------
  - CKV_AWS_50     # X-Ray tracing: observabilidad opcional
  - CKV_AWS_115    # Concurrencia reservada: operativa
  - CKV_AWS_116    # DLQ: depende del patrón de invocación
  - CKV_AWS_117    # Lambda en VPC: solo si accede a recursos privados
  - CKV_AWS_272    # Code signing: no implementado; evaluar en roadmap supply chain

  # ---------------------------------------------------------------------------
  # BLOQUE 7 · Route 53 / RDS IAM auth: decisiones evaluadas y diferidas
  # ---------------------------------------------------------------------------
  - CKV2_AWS_38    # DNSSEC: evaluar por dominio; requiere soporte del registrador
  - CKV2_AWS_39    # DNS query logging: evaluar costo/valor; no requerido por baseline
  - CKV_AWS_161    # RDS IAM auth: el estándar es credenciales vía Secrets Manager

