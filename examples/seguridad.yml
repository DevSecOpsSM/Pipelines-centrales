# ═══════════════════════════════════════════════════════════════════════════
# EJEMPLO — Workflow consumidor (repositorio de aplicación)
# Archivo: .github/workflows/seguridad.yml
# Copiar este archivo en cada repositorio de aplicación de la organización.
#
# Este archivo NO contiene lógica de seguridad — solo llama a los pipelines
# centralizados en MiOrg/pipelines-centrales
#
# Pre-requisito: configurar la organización según README de pipelines-centrales
# ═══════════════════════════════════════════════════════════════════════════

name: Seguridad SSDLC

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    # Escaneo nocturno completo: lunes a viernes a las 2:00 AM UTC
    - cron: "0 2 * * 1-5"

# Permisos mínimos requeridos globales
permissions:
  contents: read
  actions: read
  issues: write
jobs:

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 1 — Detección de secretos (Gitleaks + TruffleHog)
  # ──────────────────────────────────────────────────────────────────────
  secretos:
    name: "Etapa 1 · Secrets Scan"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-secrets.yml@main
    # secrets: inherit  # Descomentar si necesitas pasar PIPELINE_TOKEN

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 2 — SAST: Análisis estático (Semgrep OWASP Top 10)
  # ──────────────────────────────────────────────────────────────────────
  sast:
    name: "Etapa 2 · SAST"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-sast.yml@main

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 3 — Seguridad de contenedores (KICS + Hadolint + Trivy)
  # ──────────────────────────────────────────────────────────────────────
  contenedores:
    name: "Etapa 3 · Container Security"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-containers.yml@main

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 4 — Especializada en Infraestructura (Checkov)
  # ──────────────────────────────────────────────────────────────────────
  iac:
    name: "Etapa 4 · Checkov (IaC)"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-iac-checkov.yml@main

  # ──────────────────────────────────────────────────────────────────────
  # RESUMEN — Step summary visible en la UI de GitHub Actions
  # ──────────────────────────────────────────────────────────────────────
  resumen:
    name: "Resumen de Seguridad"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secretos
      - sast
      - contenedores
      - iac

    steps:
      - name: Generar resumen en GitHub Actions UI
        run: |
          STATUS_ICON() {
            case "$1" in
              success)  echo "✅" ;;
              failure)  echo "❌" ;;
              skipped)  echo "⏭️" ;;
              *)        echo "⚠️" ;;
            esac
          }
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🔒 Resumen SSDLC — ${{ github.repository }}
          | # | Etapa | Herramientas | Estado |
          |---|-------|-------------|--------|
          | 1 | Secrets Detection | Gitleaks · TruffleHog | $(STATUS_ICON "${{ needs.secretos.result }}") ${{ needs.secretos.result }} |
          | 2 | SAST | Semgrep (OWASP Top 10) | $(STATUS_ICON "${{ needs.sast.result }}") ${{ needs.sast.result }} |
          | 3 | Container Security | KICS · Hadolint · Trivy | $(STATUS_ICON "${{ needs.contenedores.result }}") ${{ needs.contenedores.result }} |
          | 4 | Infraestructura | Checkov (Terraform) | $(STATUS_ICON "${{ needs.iac.result }}") ${{ needs.iac.result }} |
          
          > 📋 Los reportes HTML detallados están disponibles en la pestaña **Artifacts** de este workflow run.
          >
          > 🛡️ **Quality Gate Activo** — Los hallazgos críticos y altos bloquean la integración del código.
          >
          > Ejecutado por: **pipelines-centrales** · Equipo Cybersecurity
          EOF

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 5 — Empaquetar y Limpiar Reportes (Consolidación)
  # ──────────────────────────────────────────────────────────────────────
  empaquetar-reportes:
    name: "📦 Consolidar Reportes"
    needs: [secretos, sast, contenedores, iac]
    if: always()
    runs-on: ubuntu-latest
    # Se eleva el permiso LOCALMENTE para poder borrar los artefactos vía API
    permissions:
      actions: write
    steps:
      - name: Descargar reportes individuales
        uses: actions/download-artifact@v4
        with:
          pattern: security-*
          path: Reportes-${{ github.event.repository.name }}
          merge-multiple: true

      - name: Subir carpeta unificada
        uses: actions/upload-artifact@v4
        with:
          name: Reportes-Seguridad-${{ github.event.repository.name }}
          path: Reportes-${{ github.event.repository.name }}/
          retention-days: 30

      - name: Limpiar artefactos temporales de la interfaz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Borrando artefactos individuales para limpiar la interfaz..."
          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[] | select(.name | startswith("security-")) | .id')
          for id in $ARTIFACTS; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE || true
          done
          echo "¡Limpieza completada! Solo queda el paquete consolidado."
