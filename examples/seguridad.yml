# ═══════════════════════════════════════════════════════════════════════════
# EJEMPLO — Workflow consumidor (repositorio de aplicación)
# Archivo: .github/workflows/seguridad.yml
#
# Copia este archivo en cada repositorio de aplicación de la organización.
# No contiene lógica de seguridad — solo llama a los workflows centralizados
# en <Org>/pipelines-centrales y al final ejecuta el Quality Gate consolidado.
#
# Pre-requisitos (1 sola vez, a nivel organización):
#   1. pipelines-centrales con visibility = Internal
#   2. Allow reusable workflows en Settings → Actions
#   3. (Opcional) Secret organizacional NVD_API_KEY
#   4. (Si usas SonarQube) Secret SONAR_TOKEN por-repo u organizacional
# ═══════════════════════════════════════════════════════════════════════════

name: Seguridad SSDLC

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
    branches:
      - main
      - uat
      - develop
  workflow_dispatch: {}
  schedule:
    # Escaneo nocturno completo: lunes a viernes a las 2:00 AM UTC
    - cron: "0 2 * * 1-5"

permissions:
  contents: read
  actions: read
  pull-requests: write    # Necesario para que quality-gate-consolidated comente en el PR
  issues: write           # Reservado por compatibilidad (DEPRECATED — issues no es el canal nuevo)

jobs:

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 1 — Pre-commit Hooks (Kicks)
  # ──────────────────────────────────────────────────────────────────────
  hooks:
    name: "Etapa 1 · Pre-commit Hooks"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-hooks.yml@feat/defectdojo-upload

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 2 — Detección de secretos (Gitleaks)
  # ──────────────────────────────────────────────────────────────────────
  secretos:
    name: "Etapa 2 · Secrets Scan"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-secrets.yml@feat/defectdojo-upload

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 3 — SAST: Análisis estático (Semgrep OWASP Top 10)
  # ──────────────────────────────────────────────────────────────────────
  sast:
    name: "Etapa 3 · SAST (Semgrep)"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-sast.yml@feat/defectdojo-upload

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 4 — SCA: Análisis de dependencias (OWASP Dependency-Check)
  # DESACTIVADA temporalmente para el análisis de seguridad puntual.
  # Reactivar descomentando el bloque y añadiendo `sca` al `needs:` del
  # quality-gate-consolidated.
  # ──────────────────────────────────────────────────────────────────────
  # sca:
  #   name: "Etapa 4 · SCA (Dependency-Check)"
  #   uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-sca.yml@feat/defectdojo-upload
  #   secrets:
  #     NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 5 — IaC: Análisis Full de Terraform
  # Herramientas: terraform fmt · terraform validate · tflint · Checkov
  # Emite un único qg-summary-sec-iac-terraform.json consolidado.
  # ──────────────────────────────────────────────────────────────────────
  iac:
    name: "Etapa 5 · IaC Terraform Full"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-iac-terraform.yml@v1.0.0

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 6 — Seguridad de contenedores (KICS + Hadolint + Trivy)
  # ──────────────────────────────────────────────────────────────────────
  contenedores:
    name: "Etapa 6 · Container Security"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-containers.yml@feat/defectdojo-upload

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 7 — SAST (SonarQube en instancia)
  # Requiere: secret SONAR_TOKEN a nivel repo u organización
  # Runner: self-hosted con visibilidad del servidor SonarQube.
  #
  # skip-tests: true → se omiten las pruebas unitarias (pytest/jest/mvn/etc.)
  # y por tanto no se calcula coverage. SonarQube sigue ejecutando SAST +
  # security hotspots. El equipo aceptó el trade-off (coverage saldrá 0%).
  # ──────────────────────────────────────────────────────────────────────
  sonarqube:
    name: "Etapa 7 · SonarQube (SAST)"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-sonarqube.yml@feat/defectdojo-upload
    with:
      sonar-host-url: "http://localhost:9095"
      skip-tests:     true
      # sonar-project-key: "mi-proyecto-customkey"
      # runner-label:      "self-hosted"
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 8 — DefectDojo Upload (ASOC / Vulnerability Management)
  #
  # Sube los raw JSONs de los 7 scanners (Semgrep, Gitleaks, Dependency-Check,
  # Checkov, KICS, Trivy, Hadolint) al servidor DefectDojo on-prem usando la
  # API REST con parsers nativos por herramienta.
  #
  # SonarQube NO se sube desde aquí: se integra nativamente en DefectDojo
  # vía la API key configurada en el Product Settings (evita duplicados).
  #
  # Pre-requisitos:
  #   - Secret organizacional DEFECTDOJO_TOKEN (token API con permiso Import)
  #   - Servidor DD alcanzable desde el runner (self-hosted por defecto)
  #   - auto_create_context=true → DD crea Product/Engagement automático
  #
  # Modo Auditoría: continue-on-error dentro del workflow reutilizable.
  # Outage de DefectDojo NO bloquea el pipeline. La decisión pass/fail la
  # sigue tomando el quality-gate-consolidated con los raw JSONs locales.
  #
  # Se ejecuta en PARALELO con quality-gate-consolidated (ambos dependen de
  # los mismos jobs de scan) para no retrasar el veredicto ni el ZIP final.
  # ──────────────────────────────────────────────────────────────────────
  defectdojo:
    name: "Etapa 8 · DefectDojo Upload"
    needs: [hooks, secretos, sast, iac, contenedores, sonarqube]
    # ↑ mismas dependencias que quality-gate-consolidated (paralelismo).
    #   Reactivar `sca` aquí también cuando se descomente el job sca arriba.
    if: always()
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-defectdojo-upload.yml@feat/defectdojo-upload
    with:
      defectdojo-url: "https://defectdojo.miempresa.internal"
      # runner-label: "self-hosted"          # default; override si necesitas otro
      # engagement-branch: "main"            # default = github.ref_name
    secrets:
      DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════
  # QUALITY GATE CONSOLIDADO — Decide pass/fail aplicando tabla CVSSv3
  # acumulada entre todas las etapas. Publica:
  #   - UN comentario sticky en el PR (vía actions/github-script@v8)
  #   - Step summary con la tabla por etapa + umbrales + top findings
  #   - Artifact quality-gate-final.json
  # Falla con exit 1 si los umbrales se exceden.
  # ══════════════════════════════════════════════════════════════════════
  quality-gate-consolidated:
    name: "Quality Gate — Consolidado"
    needs: [hooks, secretos, sast, iac, contenedores, sonarqube]
    # ↑ sca removido temporalmente. Reactivar cuando se descomente el job sca arriba.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout pipelines-centrales (para el script consolidator)
        uses: actions/checkout@v4
        with:
          repository: DevSecOpsSM/pipelines-centrales
          ref: feat/defectdojo-upload
          path: .pipelines-centrales

      - name: Descargar qg-summaries de todas las etapas
        uses: actions/download-artifact@v4
        with:
          pattern: qg-summary-*
          path: qg-summaries/
          merge-multiple: false

      - name: Listar summaries descargados
        run: |
          echo "=== Summaries descargados ==="
          find qg-summaries -name "qg-summary-*.json" -type f | sort
          echo "============================="

      - name: Ejecutar Quality Gate Consolidator
        id: qg
        continue-on-error: true
        env:
          GH_REPO:   ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA:    ${{ github.sha }}
        run: |
          mkdir -p qg-output
          python3 .pipelines-centrales/scripts/quality_gate_consolidator.py \
            --summaries-dir qg-summaries \
            --repo "$GH_REPO" \
            --run-id "$GH_RUN_ID" \
            --sha "$GH_SHA" \
            --comment-out qg-output/pr-comment.md \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --result-out qg-output/quality-gate-final.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Subir quality-gate-final.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-final
          path: qg-output/quality-gate-final.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publicar comentario consolidado en el PR (sticky)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          COMMENT_FILE: qg-output/pr-comment.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- security-quality-gate -->';
            const file   = process.env.COMMENT_FILE;

            if (!fs.existsSync(file)) {
              core.warning(`No se encontró ${file} — saltando publicación del comentario`);
              return;
            }
            const body = fs.readFileSync(file, 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(c => c.body && c.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
              core.info(`Actualizado comentario sticky #${previous.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info('Creado comentario sticky nuevo');
            }

      - name: Fallar el job si el Quality Gate bloqueó
        if: always()
        run: |
          if [ -f qg-output/quality-gate-final.json ]; then
            BLOCKED=$(python3 -c "import json; print(json.load(open('qg-output/quality-gate-final.json'))['blocked'])")
            if [ "$BLOCKED" = "True" ]; then
              echo "::error title=Quality Gate Blocked::Uno o más umbrales CVSSv3 excedidos. Revisa el comentario del PR o el Step Summary."
              exit 1
            fi
            echo "::notice title=Quality Gate Passed::Ningún umbral excedido"
            exit 0
          fi
          echo "::error title=Quality Gate Error::quality-gate-final.json no fue generado — ¿ningún workflow corrió?"
          exit 1

  # ══════════════════════════════════════════════════════════════════════
  # BUNDLE ENTREGABLE — consolida PDFs + HTMLs + JSONs + qg-summaries
  # en un único ZIP `sec-report.zip`.
  #
  # Nombres cortos (BUNDLE_DIR = sec-report-{sha7}, artifact name = sec-report)
  # para no reventar el límite MAX_PATH de 260 chars de Windows cuando el
  # equipo descomprime el reporte en su máquina.
  #
  # Después de crear el ZIP, borra todos los artifacts individuales del run
  # para dejar como único entregable el bundle consolidado.
  # ══════════════════════════════════════════════════════════════════════
  consolidate-artifacts:
    name: "Consolidar reportes en ZIP entregable"
    needs: [quality-gate-consolidated, defectdojo]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: DevSecOpsSM/pipelines-centrales
          ref: feat/defectdojo-upload
          path: .pipelines-centrales

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts/
          merge-multiple: false

      - name: Preparar JSONs raw para el batch
        run: |
          set -e
          mkdir -p raw-jsons
          # Incluye los 2 JSONs auxiliares del workflow sec-iac-terraform
          # (terraform-native-raw.json, tflint-raw.json) además del
          # checkov-raw.json primario.
          for name in gitleaks-raw.json semgrep-raw.json dependency-check-report.json \
                     checkov-raw.json terraform-native-raw.json tflint-raw.json \
                     kics-results.json hadolint-raw.json \
                     trivy-raw.json sonar-issues.json; do
            find all-artifacts -name "$name" -exec cp {} raw-jsons/ \; 2>/dev/null || true
          done
          echo "=== JSONs recolectados ==="
          ls -la raw-jsons/ 2>/dev/null || echo "(vacío)"

      - name: Instalar reportlab
        run: pip install --quiet reportlab

      - name: Ejecutar batch_generate_reports.py
        run: |
          mkdir -p pdfs
          python3 .pipelines-centrales/report-templates/batch_generate_reports.py \
            --input-dir raw-jsons --output-dir pdfs \
            --repo "${{ github.repository }}" --sha "${{ github.sha }}"

      - name: Preparar bundle ZIP
        run: |
          set -e
          # ─────────────────────────────────────────────────────────────
          # Nombres cortos para no reventar MAX_PATH de Windows (260).
          # Antes: security-analysis-{repo-full}-{branch}  →  70+ chars
          # Ahora: sec-report-{sha7}                       →  18 chars
          # El nombre completo del repo y la rama van en el README interno,
          # no en el path — así conservamos trazabilidad sin arruinar la
          # descompresión en Windows.
          # ─────────────────────────────────────────────────────────────
          SHA_SHORT="${GITHUB_SHA:0:7}"
          BUNDLE_DIR="sec-report-${SHA_SHORT}"
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"

          mkdir -p "$BUNDLE_DIR"/{01-pdf-ejecutivo,02-pdf-individuales,03-html-reports,04-raw-json,05-qg-summary}

          [ -f pdfs/01-executive-summary.pdf ] && cp pdfs/01-executive-summary.pdf "$BUNDLE_DIR/01-pdf-ejecutivo/"
          find pdfs -name "0[2-9]-*.pdf" -exec cp {} "$BUNDLE_DIR/02-pdf-individuales/" \; 2>/dev/null || true
          find all-artifacts -name "*.html" -exec cp {} "$BUNDLE_DIR/03-html-reports/" \; 2>/dev/null || true
          cp -r raw-jsons/* "$BUNDLE_DIR/04-raw-json/" 2>/dev/null || true
          find all-artifacts -name "qg-summary-*.json" -exec cp {} "$BUNDLE_DIR/05-qg-summary/" \; 2>/dev/null || true
          find all-artifacts -name "quality-gate-final.json" -exec cp {} "$BUNDLE_DIR/05-qg-summary/" \; 2>/dev/null || true
          [ -f pdfs/batch-manifest.json ] && cp pdfs/batch-manifest.json "$BUNDLE_DIR/"

          cat > "$BUNDLE_DIR/README.md" <<EOF
          # Análisis SSDLC — ${{ github.repository }}

          **Rama analizada:** \`${{ github.ref_name }}\`
          **Commit:**         \`${{ github.sha }}\`
          **Ejecutado:**      $(date -u '+%Y-%m-%d %H:%M UTC')

          ## Estructura
          - 01-pdf-ejecutivo/     PDF consolidado para stakeholders
          - 02-pdf-individuales/  PDF por herramienta con detalle
          - 03-html-reports/      HTMLs interactivos con botón PDF
          - 04-raw-json/          Outputs crudos
          - 05-qg-summary/        Sumarios CVSSv3 + veredicto QG
          EOF

          zip -r "$BUNDLE_DIR.zip" "$BUNDLE_DIR" -q

      - uses: actions/upload-artifact@v4
        with:
          name: sec-report
          path: ${{ env.BUNDLE_DIR }}.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Borrar artifacts individuales (solo si ZIP creado)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const KEEP = new Set(['sec-report', 'quality-gate-final']);
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId, per_page: 100,
            });
            const zipExists = data.artifacts.some(a => a.name === 'sec-report');
            if (!zipExists) {
              core.warning('ZIP no creado — conservando individuales para debug');
              return;
            }
            for (const art of data.artifacts) {
              if (KEEP.has(art.name)) continue;
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: art.id });
              } catch (e) {
                core.warning(`No pude borrar ${art.name}: ${e.message}`);
              }
            }
