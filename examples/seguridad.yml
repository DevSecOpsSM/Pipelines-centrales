# ═══════════════════════════════════════════════════════════════════════════
# EJEMPLO — Workflow consumidor (repositorio de aplicación)
# Archivo: .github/workflows/seguridad.yml
#
# Copia este archivo en cada repositorio de aplicación de la organización.
# No contiene lógica de seguridad — solo llama a los workflows centralizados
# en <Org>/pipelines-centrales y al final ejecuta el Quality Gate consolidado.
#
# Pre-requisitos (1 sola vez, a nivel organización):
#   1. pipelines-centrales con visibility = Internal
#   2. Allow reusable workflows en Settings → Actions
#   3. (Opcional) Secret organizacional NVD_API_KEY
#   4. (Si usas SonarQube) Secret SONAR_TOKEN por-repo u organizacional
# ═══════════════════════════════════════════════════════════════════════════

name: Seguridad SSDLC

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
    branches:
      - main
      - uat
      - develop
  workflow_dispatch: {}
  schedule:
    # Escaneo nocturno completo: lunes a viernes a las 2:00 AM UTC
    - cron: "0 2 * * 1-5"

permissions:
  contents: read
  actions: read
  pull-requests: write    # Necesario para que quality-gate-consolidated comente en el PR
  issues: write           # Reservado por compatibilidad (DEPRECATED — issues no es el canal nuevo)

jobs:

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 1 — Pre-commit Hooks (Kicks)
  # ──────────────────────────────────────────────────────────────────────
  hooks:
    name: "Etapa 1 · Pre-commit Hooks"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-hooks.yml@main

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 2 — Detección de secretos (Gitleaks)
  # ──────────────────────────────────────────────────────────────────────
  secretos:
    name: "Etapa 2 · Secrets Scan"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-secrets.yml@main

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 3 — SAST: Análisis estático (Semgrep OWASP Top 10)
  # ──────────────────────────────────────────────────────────────────────
  sast:
    name: "Etapa 3 · SAST (Semgrep)"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-sast.yml@main

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 4 — SCA: Análisis de dependencias (OWASP Dependency-Check)
  # DESACTIVADA temporalmente para el análisis de seguridad puntual.
  # Reactivar descomentando el bloque y añadiendo `sca` al `needs:` del
  # quality-gate-consolidated.
  # ──────────────────────────────────────────────────────────────────────
  # sca:
  #   name: "Etapa 4 · SCA (Dependency-Check)"
  #   uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-sca.yml@main
  #   secrets:
  #     NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 5 — IaC: Análisis de Terraform (Checkov)
  # ──────────────────────────────────────────────────────────────────────
  iac:
    name: "Etapa 5 · IaC (Checkov)"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-iac-terraform.yml@main

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 6 — Seguridad de contenedores (KICS + Hadolint + Trivy)
  # ──────────────────────────────────────────────────────────────────────
  contenedores:
    name: "Etapa 6 · Container Security"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-containers.yml@main

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 7 — SAST + Coverage (SonarQube on-prem)
  # Requiere: secret SONAR_TOKEN a nivel repo u organización
  # Runner: self-hosted con visibilidad del servidor SonarQube interno
  # ──────────────────────────────────────────────────────────────────────
  sonarqube:
    name: "Etapa 7 · SonarQube (SAST + Coverage)"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-sonarqube.yml@main
    # with:
    #   sonar-host-url:    "http://sonar.miempresa.internal:9005"
    #   sonar-project-key: "mi-proyecto-customkey"
    #   runner-label:      "self-hosted"
    #   coverage-threshold: 80
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════
  # QUALITY GATE CONSOLIDADO — Decide pass/fail aplicando tabla CVSSv3
  # acumulada entre todas las etapas. Publica:
  #   - UN comentario sticky en el PR (vía actions/github-script@v8)
  #   - Step summary con la tabla por etapa + umbrales + top findings
  #   - Artifact quality-gate-final.json
  # Falla con exit 1 si los umbrales se exceden.
  # ══════════════════════════════════════════════════════════════════════
  quality-gate-consolidated:
    name: "Quality Gate — Consolidado"
    needs: [hooks, secretos, sast, iac, contenedores, sonarqube]
    # ↑ sca removido temporalmente. Reactivar cuando se descomente el job sca arriba.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout pipelines-centrales (para el script consolidator)
        uses: actions/checkout@v4
        with:
          repository: DevSecOpsSM/pipelines-centrales
          ref: main
          path: .pipelines-centrales

      - name: Descargar qg-summaries de todas las etapas
        uses: actions/download-artifact@v4
        with:
          pattern: qg-summary-*
          path: qg-summaries/
          merge-multiple: false

      - name: Listar summaries descargados
        run: |
          echo "=== Summaries descargados ==="
          find qg-summaries -name "qg-summary-*.json" -type f | sort
          echo "============================="

      - name: Ejecutar Quality Gate Consolidator
        id: qg
        continue-on-error: true
        env:
          GH_REPO:   ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA:    ${{ github.sha }}
        run: |
          mkdir -p qg-output
          python3 .pipelines-centrales/scripts/quality_gate_consolidator.py \
            --summaries-dir qg-summaries \
            --repo "$GH_REPO" \
            --run-id "$GH_RUN_ID" \
            --sha "$GH_SHA" \
            --comment-out qg-output/pr-comment.md \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --result-out qg-output/quality-gate-final.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Subir quality-gate-final.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-final
          path: qg-output/quality-gate-final.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publicar comentario consolidado en el PR (sticky)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          COMMENT_FILE: qg-output/pr-comment.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- security-quality-gate -->';
            const file   = process.env.COMMENT_FILE;

            if (!fs.existsSync(file)) {
              core.warning(`No se encontró ${file} — saltando publicación del comentario`);
              return;
            }
            const body = fs.readFileSync(file, 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(c => c.body && c.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
              core.info(`Actualizado comentario sticky #${previous.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info('Creado comentario sticky nuevo');
            }

      - name: Fallar el job si el Quality Gate bloqueó
        if: always()
        run: |
          if [ -f qg-output/quality-gate-final.json ]; then
            BLOCKED=$(python3 -c "import json; print(json.load(open('qg-output/quality-gate-final.json'))['blocked'])")
            if [ "$BLOCKED" = "True" ]; then
              echo "::error title=Quality Gate Blocked::Uno o más umbrales CVSSv3 excedidos. Revisa el comentario del PR o el Step Summary."
              exit 1
            fi
            echo "::notice title=Quality Gate Passed::Ningún umbral excedido"
            exit 0
          fi
          echo "::error title=Quality Gate Error::quality-gate-final.json no fue generado — ¿ningún workflow corrió?"
          exit 1
