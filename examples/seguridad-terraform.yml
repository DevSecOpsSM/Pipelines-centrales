# ═══════════════════════════════════════════════════════════════════════════
# EJEMPLO — Workflow consumidor SOLO Terraform
# Archivo: .github/workflows/seguridad.yml
#
# Variante especializada del canonical `examples/seguridad.yml` para
# repositorios que SOLO contienen infraestructura Terraform (sin app code).
# Ejecuta el análisis full de Terraform (fmt · validate · tflint · Checkov),
# aplica el Quality Gate CVSSv3 y produce el ZIP entregable.
#
# Ramas analizadas: main · develop · uat  (push y pull_request)
#
# Pre-requisitos (1 sola vez, a nivel organización):
#   1. pipelines-centrales con visibility = Internal
#   2. Allow reusable workflows en Settings → Actions
# ═══════════════════════════════════════════════════════════════════════════

name: Seguridad IaC — Terraform

on:
  push:
    branches:
      - main
      - develop
      - uat
  pull_request:
    branches:
      - main
      - develop
      - uat
  workflow_dispatch: {}
  schedule:
    # Escaneo nocturno: lunes a viernes a las 2:00 AM UTC
    - cron: "0 2 * * 1-5"

permissions:
  contents: read
  actions: read
  pull-requests: write    # Necesario para el comentario sticky del Quality Gate

jobs:

  # ──────────────────────────────────────────────────────────────────────
  # ETAPA 1 — Terraform Full Analysis
  # Herramientas: terraform fmt · terraform validate · tflint · Checkov
  # Emite un único qg-summary-sec-iac-terraform.json consolidado.
  #
  # NOTA de versión: el pipeline reusable está en `@main`. Cuando el equipo
  # publique el tag `v1.1.0` (primer release que incluye el terraform full),
  # cambia el ref a `@v1.1.0` para SemVer pinning.
  # ──────────────────────────────────────────────────────────────────────
  iac:
    name: "Terraform Full Analysis"
    uses: DevSecOpsSM/pipelines-centrales/.github/workflows/sec-iac-terraform.yml@main

  # ══════════════════════════════════════════════════════════════════════
  # QUALITY GATE CONSOLIDADO — Aplica la tabla CVSSv3 al qg-summary de
  # Terraform. Publica:
  #   - UN comentario sticky en el PR (vía actions/github-script@v8)
  #   - Step summary con la tabla de severidades + umbrales + top findings
  #   - Artifact quality-gate-final.json
  # Falla con exit 1 si los umbrales se exceden.
  # ══════════════════════════════════════════════════════════════════════
  quality-gate-consolidated:
    name: "Quality Gate — Consolidado"
    needs: [iac]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout pipelines-centrales (para el script consolidator)
        uses: actions/checkout@v4
        with:
          repository: DevSecOpsSM/pipelines-centrales
          ref: main
          path: .pipelines-centrales

      - name: Descargar qg-summary de Terraform
        uses: actions/download-artifact@v4
        with:
          pattern: qg-summary-*
          path: qg-summaries/
          merge-multiple: false

      - name: Listar summaries descargados
        run: |
          echo "=== Summaries descargados ==="
          find qg-summaries -name "qg-summary-*.json" -type f | sort
          echo "============================="

      - name: Ejecutar Quality Gate Consolidator
        id: qg
        continue-on-error: true
        env:
          GH_REPO:   ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA:    ${{ github.sha }}
        run: |
          mkdir -p qg-output
          python3 .pipelines-centrales/scripts/quality_gate_consolidator.py \
            --summaries-dir qg-summaries \
            --repo "$GH_REPO" \
            --run-id "$GH_RUN_ID" \
            --sha "$GH_SHA" \
            --comment-out qg-output/pr-comment.md \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --result-out qg-output/quality-gate-final.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Subir quality-gate-final.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-final
          path: qg-output/quality-gate-final.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publicar comentario consolidado en el PR (sticky)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          COMMENT_FILE: qg-output/pr-comment.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- security-quality-gate -->';
            const file   = process.env.COMMENT_FILE;

            if (!fs.existsSync(file)) {
              core.warning(`No se encontró ${file} — saltando publicación del comentario`);
              return;
            }
            const body = fs.readFileSync(file, 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(c => c.body && c.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
              core.info(`Actualizado comentario sticky #${previous.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info('Creado comentario sticky nuevo');
            }

      - name: Fallar el job si el Quality Gate bloqueó
        if: always()
        run: |
          if [ -f qg-output/quality-gate-final.json ]; then
            BLOCKED=$(python3 -c "import json; print(json.load(open('qg-output/quality-gate-final.json'))['blocked'])")
            if [ "$BLOCKED" = "True" ]; then
              echo "::error title=Quality Gate Blocked::Uno o más umbrales CVSSv3 excedidos. Revisa el comentario del PR o el Step Summary."
              exit 1
            fi
            echo "::notice title=Quality Gate Passed::Ningún umbral excedido"
            exit 0
          fi
          echo "::error title=Quality Gate Error::quality-gate-final.json no fue generado — ¿el job iac corrió?"
          exit 1

  # ══════════════════════════════════════════════════════════════════════
  # BUNDLE ENTREGABLE — Empaqueta PDF Terraform Full + HTMLs por
  # herramienta + JSONs raw + qg-summary en un ZIP único `sec-report.zip`.
  #
  # Estructura interna:
  #   01-pdf-ejecutivo/     PDF consolidado del análisis Terraform
  #   02-pdf-individuales/  (n/a en variante Terraform-only)
  #   03-html-reports/      HTMLs de fmt+validate, tflint, Checkov
  #   04-raw-json/          Outputs crudos de las 4 herramientas
  #   05-qg-summary/        qg-summary-sec-iac-terraform.json + quality-gate-final.json
  #
  # Nombres cortos (BUNDLE_DIR = sec-report-{sha7}) para no reventar MAX_PATH
  # de Windows al descomprimir.
  # ══════════════════════════════════════════════════════════════════════
  consolidate-artifacts:
    name: "Consolidar reportes en ZIP entregable"
    needs: [quality-gate-consolidated]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: DevSecOpsSM/pipelines-centrales
          ref: main
          path: .pipelines-centrales

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts/
          merge-multiple: false

      - name: Preparar JSONs raw para el batch
        run: |
          set -e
          mkdir -p raw-jsons
          # 3 JSONs del workflow sec-iac-terraform (Checkov primary + 2 aux).
          for name in checkov-raw.json terraform-native-raw.json tflint-raw.json; do
            find all-artifacts -name "$name" -exec cp {} raw-jsons/ \; 2>/dev/null || true
          done
          echo "=== JSONs recolectados ==="
          ls -la raw-jsons/ 2>/dev/null || echo "(vacío)"

      - name: Instalar reportlab
        run: pip install --quiet reportlab

      - name: Ejecutar batch_generate_reports.py
        run: |
          mkdir -p pdfs
          python3 .pipelines-centrales/report-templates/batch_generate_reports.py \
            --input-dir raw-jsons --output-dir pdfs \
            --repo "${{ github.repository }}" --sha "${{ github.sha }}"

      - name: Preparar bundle ZIP
        run: |
          set -e
          SHA_SHORT="${GITHUB_SHA:0:7}"
          BUNDLE_DIR="sec-report-${SHA_SHORT}"
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"

          mkdir -p "$BUNDLE_DIR"/{01-pdf-ejecutivo,02-pdf-individuales,03-html-reports,04-raw-json,05-qg-summary}

          [ -f pdfs/01-executive-summary.pdf ] && cp pdfs/01-executive-summary.pdf "$BUNDLE_DIR/01-pdf-ejecutivo/"
          find pdfs -name "0[2-9]-*.pdf" -exec cp {} "$BUNDLE_DIR/02-pdf-individuales/" \; 2>/dev/null || true
          find all-artifacts -name "*.html" -exec cp {} "$BUNDLE_DIR/03-html-reports/" \; 2>/dev/null || true
          cp -r raw-jsons/* "$BUNDLE_DIR/04-raw-json/" 2>/dev/null || true
          find all-artifacts -name "qg-summary-*.json" -exec cp {} "$BUNDLE_DIR/05-qg-summary/" \; 2>/dev/null || true
          find all-artifacts -name "quality-gate-final.json" -exec cp {} "$BUNDLE_DIR/05-qg-summary/" \; 2>/dev/null || true
          [ -f pdfs/batch-manifest.json ] && cp pdfs/batch-manifest.json "$BUNDLE_DIR/"

          cat > "$BUNDLE_DIR/README.md" <<EOF
          # Análisis IaC Terraform — ${{ github.repository }}

          **Rama analizada:** \`${{ github.ref_name }}\`
          **Commit:**         \`${{ github.sha }}\`
          **Ejecutado:**      $(date -u '+%Y-%m-%d %H:%M UTC')

          ## Estructura
          - 01-pdf-ejecutivo/     PDF consolidado Terraform Full (4 secciones)
          - 03-html-reports/      HTMLs interactivos por herramienta
          - 04-raw-json/          Outputs crudos (Checkov, tflint, fmt+validate)
          - 05-qg-summary/        Sumario CVSSv3 + veredicto QG

          ## Herramientas ejecutadas
          - terraform fmt (HashiCorp CLI)
          - terraform validate (HashiCorp CLI)
          - tflint v0.53.0
          - Checkov 3.2.334 (Prisma Cloud)
          EOF

          zip -r "$BUNDLE_DIR.zip" "$BUNDLE_DIR" -q

      - uses: actions/upload-artifact@v4
        with:
          name: sec-report
          path: ${{ env.BUNDLE_DIR }}.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Borrar artifacts individuales (solo si ZIP creado)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const KEEP = new Set(['sec-report', 'quality-gate-final']);
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId, per_page: 100,
            });
            const zipExists = data.artifacts.some(a => a.name === 'sec-report');
            if (!zipExists) {
              core.warning('ZIP no creado — conservando individuales para debug');
              return;
            }
            for (const art of data.artifacts) {
              if (KEEP.has(art.name)) continue;
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: art.id });
              } catch (e) {
                core.warning(`No pude borrar ${art.name}: ${e.message}`);
              }
            }
